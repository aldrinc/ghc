<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease - AI-Native Behavioral Healthcare System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-primary-dark: #113320;
            --color-primary-light: #BDE3C0;
            --color-primary-medium: #A3D2A6;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-primary-dark);
            overflow-x: hidden;
        }

        .font-serif { font-family: var(--font-serif); }
        .text-primary { color: var(--color-primary-dark); }
        .bg-primary { background-color: var(--color-primary-dark); }
        .bg-light-green { background-color: var(--color-primary-light); }
        .bg-medium-green { background-color: var(--color-primary-medium); }

        .mega-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .group:hover .mega-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-line {
            transform-origin: left;
            scale: 0 1;
        }

        .sticky-container {
            height: 200vh;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-medium);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Configuration & Constants ---
        const CONFIG = {
            navLinks: [
                { name: 'About', href: '#' },
                { name: 'Case Studies', href: '#' },
                { 
                    name: 'Resources', 
                    href: '#', 
                    dropdown: [
                        { name: 'Blog', href: '#' },
                        { name: 'Whitepapers', href: '#' },
                        { name: 'Glossary', href: '#' }
                    ]
                },
                { 
                    name: 'What We Offer', 
                    href: '#',
                    isMega: true
                }
            ],
            hero: {
                headline: "Fewer clicks. More care.",
                subheadline: "Admit more patients, reduce staff burden, and get paid faster with an AI-native system built for behavioral healthcare.",
                cta: "Request a Demo"
            },
            investors: [
                { name: "Andreessen Horowitz", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Andreessen_Horowitz_logo.svg/1200px-Andreessen_Horowitz_logo.svg.png" },
                { name: "Abstract", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1d/Abstract_Logo.svg/2560px-Abstract_Logo.svg.png" },
                { name: "Maven", logo: "https://logo.clearbit.com/maven.com" },
                { name: "BoxGroup", logo: "https://logo.clearbit.com/boxgroup.com" },
                { name: "F3", logo: "https://logo.clearbit.com/f3ventures.com" },
                { name: "Sunflower Capital", logo: "https://logo.clearbit.com/sunflower.capital" }
            ],
            specialties: ["Detox", "SUD", "Residential", "PHP", "MAT", "IOP"],
            clinicalSupport: {
                tagline: "Clinical Support",
                description: "Our platform provides end-to-end clinical workflow management, ensuring your team can focus on patient outcomes rather than paperwork.",
                stats: [
                    { label: "Reduction in documentation time", value: "40%" },
                    { label: "Faster patient admissions", value: "2x" }
                ]
            },
            problemSolution: {
                problem: {
                    title: "The problem",
                    text: "Fragmented CRM, EHR, and RCM systems are inefficient. They slow intake, burden staff, and hide revenue leakage."
                },
                solution: {
                    title: "The solution",
                    text: "Instead of bouncing between CRM, EHR, and RCM systems, Ease provides one AI-powered system for referrals, clinical notes, and billing."
                }
            },
            whyEase: {
                tagline: "Why Ease",
                headline: "A super-powered system, working together.",
                cards: [
                    {
                        icon: "fa-layer-group",
                        title: "See everything in one place.",
                        description: "Consolidate tools, reduce spend, and gain unified reporting without painful integrations."
                    },
                    {
                        icon: "fa-clipboard-check",
                        title: "Get more done, more easily.",
                        description: "AI support helps admins, clinicians, supervisors, and billers complete important tasks in less time."
                    },
                    {
                        icon: "fa-chart-line",
                        title: "Drive better outcomes.",
                        description: "Real-time analytics and intelligent workflows help you optimize every aspect of your facility."
                    }
                ]
            }
        };

        // --- Components ---

        const MegaMenu = () => (
            <div className="mega-menu absolute left-0 top-full w-screen bg-white shadow-xl border-t border-gray-100 z-50">
                <div className="max-w-7xl mx-auto px-6 py-12 grid grid-cols-4 gap-8">
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-users text-green-700"></i> CRM</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Lead management</li>
                            <li className="hover:text-green-800 cursor-pointer">Seamless EHR Connection</li>
                            <li className="hover:text-green-800 cursor-pointer">Activity & Analytics</li>
                            <li className="hover:text-green-800 cursor-pointer">Alumni & Refer-Out</li>
                        </ul>
                    </div>
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-file-medical text-green-700"></i> EHR</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Clinical Documentation</li>
                            <li className="hover:text-green-800 cursor-pointer">E-Prescribing</li>
                            <li className="hover:text-green-800 cursor-pointer">Treatment Planning</li>
                            <li className="hover:text-green-800 cursor-pointer">Patient Portal</li>
                        </ul>
                    </div>
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-file-invoice-dollar text-green-700"></i> RCM</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Billing Automation</li>
                            <li className="hover:text-green-800 cursor-pointer">Claims Management</li>
                            <li className="hover:text-green-800 cursor-pointer">Revenue Reporting</li>
                            <li className="hover:text-green-800 cursor-pointer">Denial Management</li>
                        </ul>
                    </div>
                    <div className="bg-gray-50 rounded-xl p-6 flex flex-col justify-center items-center border border-gray-100">
                        <div className="w-full bg-white rounded shadow-sm p-4 space-y-2">
                            <div className="h-2 w-3/4 bg-gray-200 rounded"></div>
                            <div className="h-2 w-1/2 bg-gray-100 rounded"></div>
                            <div className="flex gap-2 mt-4">
                                <div className="h-8 w-8 bg-green-100 rounded-full"></div>
                                <div className="h-8 flex-1 bg-green-50 rounded"></div>
                            </div>
                        </div>
                        <p className="mt-4 text-xs text-gray-500 text-center font-medium">Built for scale</p>
                    </div>
                </div>
            </div>
        );

        const Header = () => {
            return (
                <header className="sticky top-0 w-full bg-white border-b border-gray-100 z-[100]">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <div className="flex items-center gap-12">
                            <div className="text-2xl font-bold tracking-tight text-primary flex items-center gap-2">
                                <div className="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
                                    <div className="w-4 h-4 bg-white rounded-sm rotate-45"></div>
                                </div>
                                ease
                            </div>
                            <nav className="hidden md:flex items-center gap-8">
                                {CONFIG.navLinks.map((link) => (
                                    <div key={link.name} className="relative group py-6">
                                        <a href={link.href} className="text-sm font-medium text-gray-600 hover:text-primary flex items-center gap-1 transition-colors">
                                            {link.name}
                                            {(link.dropdown || link.isMega) && <i className="fas fa-chevron-down text-[10px] opacity-50 group-hover:rotate-180 transition-transform"></i>}
                                        </a>
                                        {link.dropdown && !link.isMega && (
                                            <div className="mega-menu absolute left-0 top-full w-48 bg-white shadow-lg rounded-lg border border-gray-100 py-2">
                                                {link.dropdown.map(sub => (
                                                    <a key={sub.name} href={sub.href} className="block px-4 py-2 text-sm text-gray-600 hover:bg-green-50 hover:text-primary transition-colors">{sub.name}</a>
                                                ))}
                                            </div>
                                        )}
                                        {link.isMega && <MegaMenu />}
                                    </div>
                                ))}
                            </nav>
                        </div>
                        <button className="bg-primary text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:bg-opacity-90 transition-all shadow-md active:scale-95">
                            Book a Demo
                        </button>
                    </div>
                </header>
            );
        };

        const Hero = () => {
            const [activeStep, setActiveStep] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    setActiveStep(prev => (prev + 1) % 3);
                }, 3000);
                return () => clearInterval(timer);
            }, []);

            return (
                <section className="max-w-7xl mx-auto px-6 py-12 md:py-24 grid md:grid-cols-2 gap-12 items-center">
                    <div className="bg-light-green rounded-[3rem] p-12 md:p-16 flex flex-col justify-center h-full min-h-[500px]">
                        <h1 className="text-5xl md:text-7xl font-serif text-primary leading-[1.1] mb-8">
                            {CONFIG.hero.headline}
                        </h1>
                        <p className="text-lg md:text-xl text-primary/80 mb-10 max-w-md">
                            {CONFIG.hero.subheadline}
                        </p>
                        <button className="bg-primary text-white w-fit px-8 py-4 rounded-full text-lg font-bold flex items-center gap-3 hover:gap-5 transition-all group shadow-xl">
                            {CONFIG.hero.cta}
                            <i className="fas fa-arrow-right text-sm"></i>
                        </button>
                    </div>

                    <div className="bg-gray-100 rounded-[3rem] h-full min-h-[500px] p-8 relative overflow-hidden flex items-center justify-center">
                        {/* Mock UI Animation */}
                        <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl p-6 border border-gray-200 relative z-10 transition-all duration-700">
                            <div className="flex items-center gap-4 mb-8">
                                <div className="w-12 h-12 bg-green-200 rounded-full flex items-center justify-center text-primary font-bold">ES</div>
                                <div>
                                    <div className="font-bold">Emma Smith</div>
                                    <div className="text-xs text-gray-500">ID: #82941 • Last updated 2m ago</div>
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-4">
                                <div className={`p-4 rounded-xl border transition-all duration-500 ${activeStep === 0 ? 'bg-green-50 border-green-200 scale-105 shadow-md' : 'bg-white border-gray-100'}`}>
                                    <div className="text-[10px] font-bold text-gray-400 mb-2">CRM</div>
                                    <div className="h-1 w-full bg-gray-100 rounded mb-2"></div>
                                    <div className="h-1 w-2/3 bg-gray-100 rounded"></div>
                                </div>
                                <div className={`p-4 rounded-xl border transition-all duration-500 ${activeStep === 1 ? 'bg-green-50 border-green-200 scale-105 shadow-md' : 'bg-white border-gray-100'}`}>
                                    <div className="text-[10px] font-bold text-gray-400 mb-2">EHR</div>
                                    <div className="h-1 w-full bg-gray-100 rounded mb-2"></div>
                                    <div className="h-1 w-1/2 bg-gray-100 rounded"></div>
                                </div>
                                <div className={`p-4 rounded-xl border transition-all duration-500 ${activeStep === 2 ? 'bg-green-50 border-green-200 scale-105 shadow-md' : 'bg-white border-gray-100'}`}>
                                    <div className="text-[10px] font-bold text-gray-400 mb-2">RCM</div>
                                    <div className="h-1 w-full bg-gray-100 rounded mb-2"></div>
                                    <div className="h-1 w-3/4 bg-gray-100 rounded"></div>
                                </div>
                            </div>
                            
                            <div className="mt-8 space-y-4">
                                <div className="h-4 w-full bg-gray-50 rounded animate-pulse"></div>
                                <div className="h-4 w-5/6 bg-gray-50 rounded animate-pulse"></div>
                            </div>
                        </div>

                        {/* Floating elements */}
                        <div className="absolute top-20 right-10 w-24 h-24 bg-green-200/30 rounded-full blur-2xl"></div>
                        <div className="absolute bottom-10 left-10 w-32 h-32 bg-green-300/20 rounded-full blur-3xl"></div>
                    </div>
                </section>
            );
        };

        const LogoCloud = () => (
            <section className="py-24 border-y border-gray-100">
                <div className="max-w-7xl mx-auto px-6 text-center">
                    <p className="text-sm font-semibold uppercase tracking-widest text-gray-400 mb-12">Backed by leading investors</p>
                    <div className="flex flex-wrap justify-center items-center gap-12 md:gap-20 opacity-40 grayscale transition-all hover:opacity-100 hover:grayscale-0">
                        {CONFIG.investors.map(inv => (
                            <img key={inv.name} src={inv.logo} alt={inv.name} className="h-6 md:h-8 object-contain" />
                        ))}
                    </div>
                </div>
            </section>
        );

        const ClinicalSupport = () => {
            return (
                <section className="max-w-7xl mx-auto px-6 py-24 md:py-32 grid md:grid-cols-2 gap-20">
                    <div className="bg-light-green/20 rounded-[3rem] p-12 md:p-20">
                        <div className="space-y-4">
                            {CONFIG.specialties.map((spec, i) => (
                                <div key={spec} className={`text-6xl md:text-8xl font-serif text-primary/10 transition-all duration-700 hover:text-primary hover:translate-x-4 cursor-default`}>
                                    {spec}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="relative">
                        <div className="sticky top-40 space-y-12">
                            <div>
                                <h3 className="text-sm font-bold uppercase tracking-widest text-green-700 mb-4">{CONFIG.clinicalSupport.tagline}</h3>
                                <p className="text-2xl text-primary leading-relaxed">
                                    {CONFIG.clinicalSupport.description}
                                </p>
                            </div>
                            <div className="grid grid-cols-2 gap-8">
                                {CONFIG.clinicalSupport.stats.map(stat => (
                                    <div key={stat.label}>
                                        <div className="text-5xl font-serif text-primary mb-2">{stat.value}</div>
                                        <div className="text-sm text-gray-500 font-medium">{stat.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const ProblemSolution = () => {
            const sectionRef = useRef(null);
            const containerRef = useRef(null);
            const problemRef = useRef(null);
            const solutionRef = useRef(null);
            const lineContainerRef = useRef(null);

            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);

                const tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: sectionRef.current,
                        start: "top top",
                        end: "+=200%",
                        scrub: 1,
                        pin: true,
                        anticipatePin: 1
                    }
                });

                // Lines draw in
                tl.fromTo(".scroll-line", 
                    { scaleX: 0 }, 
                    { scaleX: 1, duration: 1 }
                );

                // Problem fades out, BG starts changing
                tl.to(problemRef.current, { opacity: 0, y: -20, duration: 1 }, "+=0.2");
                tl.to(containerRef.current, { backgroundColor: "#A3D2A6", duration: 1.5 }, "<");

                // Solution fades in
                tl.fromTo(solutionRef.current, 
                    { opacity: 0, y: 20 }, 
                    { opacity: 1, y: 0, duration: 1 },
                    "-=0.5"
                );

                // Lines converge into a single horizontal line
                tl.to(".scroll-line", {
                    scaleX: 1,
                    x: 0,
                    y: (i) => (300 - 30 * i), // Move them all to a center point area
                    opacity: 0.1,
                    duration: 1
                }, "converge");

                tl.to(".scroll-line", {
                    y: 300, // All converge to a single vertical line or point
                    opacity: (i) => i === 0 ? 1 : 0,
                    duration: 1,
                    ease: "power4.inOut"
                });

                return () => {
                    ScrollTrigger.getAll().forEach(t => t.kill());
                };
            }, []);

            return (
                <div ref={sectionRef} className="h-screen overflow-hidden bg-white" id="problem-solution">
                    <div ref={containerRef} className="w-full h-full flex flex-col justify-center items-center relative transition-colors duration-1000 px-6">
                        
                        <div className="absolute w-full px-12 md:px-24 flex flex-col gap-8 opacity-20 pointer-events-none" ref={lineContainerRef}>
                            {[...Array(6)].map((_, i) => (
                                <div key={i} className="scroll-line h-[1px] bg-primary w-full"></div>
                            ))}
                        </div>

                        <div className="relative z-10 max-w-4xl text-center">
                            <div ref={problemRef} className="absolute inset-0 flex flex-col items-center justify-center">
                                <span className="text-sm font-bold uppercase tracking-widest text-primary/60 mb-6">{CONFIG.problemSolution.problem.title}</span>
                                <h2 className="text-3xl md:text-5xl font-serif text-primary leading-tight">
                                    {CONFIG.problemSolution.problem.text}
                                </h2>
                            </div>
                            
                            <div ref={solutionRef} className="opacity-0 flex flex-col items-center justify-center">
                                <span className="text-sm font-bold uppercase tracking-widest text-primary mb-6">{CONFIG.problemSolution.solution.title}</span>
                                <h2 className="text-3xl md:text-5xl font-serif text-primary leading-tight">
                                    {CONFIG.problemSolution.solution.text}
                                </h2>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const WhyEase = () => {
            const cardsRef = useRef(null);

            useEffect(() => {
                gsap.from(".why-ease-card", {
                    scrollTrigger: {
                        trigger: cardsRef.current,
                        start: "top 80%",
                    },
                    y: 50,
                    opacity: 0,
                    duration: 0.8,
                    stagger: 0.2,
                    ease: "power2.out"
                });
            }, []);

            return (
                <section className="max-w-7xl mx-auto px-6 py-24 md:py-32">
                    <div className="text-center mb-20">
                        <span className="text-sm font-bold uppercase tracking-widest text-green-700 mb-4 block">{CONFIG.whyEase.tagline}</span>
                        <h2 className="text-4xl md:text-6xl font-serif text-primary max-w-3xl mx-auto">
                            {CONFIG.whyEase.headline}
                        </h2>
                    </div>

                    <div ref={cardsRef} className="grid md:grid-cols-3 gap-8">
                        {CONFIG.whyEase.cards.map((card, i) => (
                            <div key={i} className="why-ease-card bg-light-green/40 p-10 rounded-[2.5rem] hover:bg-light-green transition-colors duration-300 group">
                                <div className="w-14 h-14 bg-white rounded-2xl flex items-center justify-center mb-8 shadow-sm group-hover:scale-110 transition-transform duration-500">
                                    <i className={`fas ${card.icon} text-primary text-xl`}></i>
                                </div>
                                <h3 className="text-2xl font-serif text-primary mb-4">{card.title}</h3>
                                <p className="text-gray-600 leading-relaxed">
                                    {card.description}
                                </p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="bg-primary text-white py-20">
                <div className="max-w-7xl mx-auto px-6 grid md:grid-cols-4 gap-12">
                    <div className="col-span-2">
                        <div className="text-3xl font-bold tracking-tight mb-8 flex items-center gap-2">
                            <div className="w-10 h-10 bg-white rounded-lg flex items-center justify-center">
                                <div className="w-5 h-5 bg-primary rounded-sm rotate-45"></div>
                            </div>
                            ease
                        </div>
                        <p className="text-white/60 max-w-sm text-lg">
                            The AI-native platform built to help behavioral healthcare facilities grow and provide better care.
                        </p>
                    </div>
                    <div>
                        <h4 className="font-bold mb-6">Product</h4>
                        <ul className="space-y-4 text-white/60">
                            <li><a href="#" className="hover:text-white transition-colors">CRM</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">EHR</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">RCM</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">Pricing</a></li>
                        </ul>
                    </div>
                    <div>
                        <h4 className="font-bold mb-6">Company</h4>
                        <ul className="space-y-4 text-white/60">
                            <li><a href="#" className="hover:text-white transition-colors">About</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">Careers</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">Contact</a></li>
                            <li><a href="#" className="hover:text-white transition-colors">Privacy</a></li>
                        </ul>
                    </div>
                </div>
                <div className="max-w-7xl mx-auto px-6 mt-20 pt-8 border-t border-white/10 text-white/40 text-sm flex flex-col md:flex-row justify-between items-center gap-4">
                    <p>&copy; 2024 Ease Systems, Inc. All rights reserved.</p>
                    <div className="flex gap-8">
                        <a href="#"><i className="fab fa-linkedin-in"></i></a>
                        <a href="#"><i className="fab fa-twitter"></i></a>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            return (
                <div className="min-h-screen bg-white selection:bg-primary selection:text-white">
                    <Header />
                    <main>
                        <Hero />
                        <LogoCloud />
                        <ClinicalSupport />
                        <ProblemSolution />
                        <WhyEase />
                        
                        {/* Final CTA Section */}
                        <section className="max-w-7xl mx-auto px-6 py-32">
                            <div className="bg-primary rounded-[3rem] p-12 md:p-24 text-center text-white relative overflow-hidden">
                                <div className="relative z-10">
                                    <h2 className="text-4xl md:text-6xl font-serif mb-8 max-w-2xl mx-auto">Ready to simplify your clinical operations?</h2>
                                    <p className="text-white/70 text-lg md:text-xl mb-12 max-w-xl mx-auto">Join dozens of leading facilities that have streamlined their workflows with Ease.</p>
                                    <button className="bg-white text-primary px-10 py-5 rounded-full text-xl font-bold hover:bg-light-green transition-all shadow-2xl active:scale-95">
                                        Request a Demo
                                    </button>
                                </div>
                                {/* Decorative elements */}
                                <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                                <div className="absolute bottom-0 left-0 w-64 h-64 bg-white/5 rounded-full blur-3xl translate-y-1/2 -translate-x-1/2"></div>
                            </div>
                        </section>
                    </main>
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
