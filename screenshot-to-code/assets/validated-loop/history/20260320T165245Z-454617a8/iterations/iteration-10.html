<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ease - AI-Native Behavioral Healthcare System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18.0.0/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.0.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-primary-dark: #113320;
            --color-primary-light: #BDE3C0;
            --color-primary-medium: #A3D2A6;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-primary-dark);
            overflow-x: hidden;
        }

        .font-serif { font-family: var(--font-serif); }
        .text-primary { color: var(--color-primary-dark); }
        .bg-primary { background-color: var(--color-primary-dark); }
        .bg-light-green { background-color: var(--color-primary-light); }
        .bg-medium-green { background-color: var(--color-primary-medium); }

        .mega-menu {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .group:hover .mega-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-line {
            transform-origin: left;
            scale: 0 1;
        }

        .sticky-container {
            height: 200vh;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-medium);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Configuration & Constants ---
        const CONFIG = {
            navLinks: [
                { name: 'About', href: '#' },
                { name: 'Case Studies', href: '#' },
                { 
                    name: 'Resources', 
                    href: '#', 
                    dropdown: [
                        { name: 'Blog', desc: 'Practice insights & guides', href: '#' },
                        { name: 'Whitepapers', desc: 'Deep dives & research', href: '#' },
                        { name: 'Glossary', desc: 'Behavioral health terms', href: '#' }
                    ]
                },
                { 
                    name: 'What We Offer', 
                    href: '#',
                    isMega: true
                }
            ],
            hero: {
                headline: "Fewer clicks. More care.",
                subheadline: "Admit more patients, reduce staff burden, and get paid faster with an AI-native system built for behavioral healthcare.",
                cta: "Request a Demo"
            },
            investors: [
                { name: "Andreessen Horowitz", logo: "https://placehold.co/200x80/e5e7eb/113320?text=a16z" },
                { name: "Abstract", logo: "https://placehold.co/200x80/e5e7eb/113320?text=Abstract" },
                { name: "Maven", logo: "https://placehold.co/200x80/e5e7eb/113320?text=Maven" },
                { name: "BoxGroup", logo: "https://placehold.co/200x80/e5e7eb/113320?text=BoxGroup" },
                { name: "F3", logo: "https://placehold.co/200x80/e5e7eb/113320?text=F3" },
                { name: "Sunflower Capital", logo: "https://placehold.co/200x80/e5e7eb/113320?text=Sunflower" }
            ],
            specialties: ["Detox", "SUD", "Residential", "PHP", "MAT", "IOP", "Outpatient", "Medication", "OBOT", "OTP"],
            clinicalSupport: {
                tagline: "Clinical Support",
                description: "Our platform provides end-to-end clinical workflow management, ensuring your team can focus on patient outcomes rather than paperwork.",
                stats: [
                    { label: "Reduction in documentation time", value: "40%" },
                    { label: "Faster patient admissions", value: "2x" }
                ]
            },
            problemSolution: {
                problem: {
                    title: "The problem",
                    text: "Fragmented CRM, EHR, and RCM systems are inefficient. They slow intake, burden staff, and hide revenue leakage."
                },
                solution: {
                    title: "The solution",
                    text: "Instead of bouncing between CRM, EHR, and RCM systems, Ease provides one AI-powered system for referrals, clinical notes, and billing."
                }
            },
            whyEase: {
                tagline: "Why Ease",
                headline: "A super-powered system, working together.",
                cards: [
                    {
                        icon: "fa-layer-group",
                        title: "See everything in one place.",
                        description: "Consolidate tools, reduce spend, and gain unified reporting without painful integrations."
                    },
                    {
                        icon: "fa-clipboard-check",
                        title: "Get more done, more easily.",
                        description: "AI support helps admins, clinicians, supervisors, and billers complete important tasks in less time."
                    },
                    {
                        icon: "fa-chart-line",
                        title: "Drive better outcomes.",
                        description: "Real-time analytics and intelligent workflows help you optimize every aspect of your facility."
                    }
                ]
            },
            heroCards: [
                {
                    type: 'CRM',
                    icon: 'fa-users',
                    title: 'Emma Smith',
                    subtitle: 'ID: #82941 • Lead',
                    content: 'Lead status: New Inquiry. Converting to patient record...',
                    cta: 'Convert to Patient'
                },
                {
                    type: 'EHR',
                    icon: 'fa-file-medical',
                    title: 'Treatment Plan',
                    subtitle: 'Active • 24m remaining',
                    content: 'Individual Therapy session in progress. Note draft created.',
                    cta: 'View Progress'
                },
                {
                    type: 'RCM',
                    icon: 'fa-dollar-sign',
                    title: 'Claims Overview',
                    subtitle: 'October 2024',
                    content: 'Net Collections: $225,390 (85% of goal reached).',
                    cta: 'Run Report'
                }
            ]
        };

        // --- Components ---

        const MegaMenu = () => (
            <div className="mega-menu absolute left-0 top-full w-screen bg-white shadow-xl border-t border-gray-100 z-50">
                <div className="max-w-7xl mx-auto px-6 py-12 grid grid-cols-4 gap-8">
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-users text-green-700"></i> CRM</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Lead management</li>
                            <li className="hover:text-green-800 cursor-pointer">Seamless EHR Connection</li>
                            <li className="hover:text-green-800 cursor-pointer">Activity & Analytics</li>
                            <li className="hover:text-green-800 cursor-pointer">Alumni & Refer-Out</li>
                        </ul>
                    </div>
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-file-medical text-green-700"></i> EHR</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Clinical Documentation</li>
                            <li className="hover:text-green-800 cursor-pointer">E-Prescribing</li>
                            <li className="hover:text-green-800 cursor-pointer">Treatment Planning</li>
                            <li className="hover:text-green-800 cursor-pointer">Patient Portal</li>
                        </ul>
                    </div>
                    <div>
                        <h3 className="flex items-center gap-2 font-bold mb-4"><i className="fas fa-file-invoice-dollar text-green-700"></i> RCM</h3>
                        <ul className="space-y-3 text-gray-600">
                            <li className="hover:text-green-800 cursor-pointer">Billing Automation</li>
                            <li className="hover:text-green-800 cursor-pointer">Claims Management</li>
                            <li className="hover:text-green-800 cursor-pointer">Revenue Reporting</li>
                            <li className="hover:text-green-800 cursor-pointer">Denial Management</li>
                        </ul>
                    </div>
                    <div className="bg-gray-50 rounded-xl p-6 flex flex-col justify-center items-center border border-gray-100">
                        <div className="w-full bg-white rounded shadow-sm p-4 space-y-2">
                            <div className="h-2 w-3/4 bg-gray-200 rounded"></div>
                            <div className="h-2 w-1/2 bg-gray-100 rounded"></div>
                            <div className="flex gap-2 mt-4">
                                <div className="h-8 w-8 bg-green-100 rounded-full"></div>
                                <div className="h-8 flex-1 bg-green-50 rounded"></div>
                            </div>
                        </div>
                        <p className="mt-4 text-xs text-gray-500 text-center font-medium">Built for scale</p>
                    </div>
                </div>
            </div>
        );

        const Header = () => {
            return (
                <header className="sticky top-0 w-full bg-white border-b border-gray-100 z-[100]">
                    <div className="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                        <div className="flex items-center gap-12">
                            <div className="text-2xl font-bold font-serif tracking-tight text-primary flex items-center gap-2">
                                <div className="w-9 h-9 bg-primary rounded-xl flex items-center justify-center">
                                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6 text-white">
                                        <path d="M21,11C21,11 13,11 10,19C10,19 4,11 3,8C3,8 3,2 11,2C11,2 21,2 21,11Z" />
                                    </svg>
                                </div>
                                ease
                            </div>
                            <nav className="hidden md:flex items-center gap-8">
                                {CONFIG.navLinks.map((link) => (
                                    <div key={link.name} className="relative group py-6">
                                        <a href={link.href} className="text-sm font-medium text-gray-600 hover:text-primary flex items-center gap-1 transition-colors">
                                            {link.name}
                                            {(link.dropdown || link.isMega) && <i className="fas fa-chevron-down text-[10px] opacity-50 group-hover:rotate-180 transition-transform"></i>}
                                        </a>
                                        {link.dropdown && !link.isMega && (
                                            <div className={`mega-menu absolute left-0 top-full bg-white shadow-xl rounded-xl border border-gray-100 py-4 ${link.name === 'Resources' ? 'w-[600px] grid grid-cols-3 gap-6 p-6' : 'w-48'}`}>
                                                {link.dropdown.map(sub => (
                                                    <a key={sub.name} href={sub.href} className="group/item block hover:bg-green-50 p-3 rounded-lg transition-colors">
                                                        <div className="text-sm font-bold text-gray-900 group-hover/item:text-primary transition-colors">{sub.name}</div>
                                                        {sub.desc && <div className="text-xs text-gray-500 mt-1">{sub.desc}</div>}
                                                    </a>
                                                ))}
                                            </div>
                                        )}
                                        {link.isMega && <MegaMenu />}
                                    </div>
                                ))}
                            </nav>
                        </div>
                        <button className="bg-primary text-white px-6 py-2.5 rounded-full text-sm font-semibold hover:bg-opacity-90 transition-all shadow-md active:scale-95">
                            Book a Demo
                        </button>
                    </div>
                </header>
            );
        };

        const Hero = () => {
            const [activeStep, setActiveStep] = useState(0);

            useEffect(() => {
                const timer = setInterval(() => {
                    setActiveStep(prev => (prev + 1) % 3);
                }, 4000);
                return () => clearInterval(timer);
            }, []);

            return (
                <section className="max-w-7xl mx-auto px-6 py-12 md:py-24 grid md:grid-cols-2 gap-12 items-center">
                    <div className="bg-light-green rounded-[3rem] p-12 md:p-16 flex flex-col justify-center h-full min-h-[500px]">
                        <h1 className="text-5xl md:text-7xl font-serif text-primary leading-[1.1] mb-8">
                            {CONFIG.hero.headline}
                        </h1>
                        <p className="text-lg md:text-xl text-primary opacity-80 mb-10 max-w-md">
                            {CONFIG.hero.subheadline}
                        </p>
                        <button className="bg-primary text-white w-fit px-8 py-4 rounded-full text-lg font-bold flex items-center gap-3 hover:gap-5 transition-all group shadow-xl">
                            {CONFIG.hero.cta}
                            <i className="fas fa-arrow-right text-sm"></i>
                        </button>
                    </div>

                    <div className="bg-gray-100 rounded-[3rem] h-full min-h-[600px] p-12 relative overflow-hidden flex flex-col">
                        {/* Column Backgrounds */}
                        <div className="absolute inset-x-12 inset-y-12 grid grid-cols-3 gap-4 pointer-events-none">
                            <div className="bg-white/40 rounded-3xl border border-white/50 shadow-sm"></div>
                            <div className="bg-white/40 rounded-3xl border border-white/50 shadow-sm"></div>
                            <div className="bg-white/40 rounded-3xl border border-white/50 shadow-sm"></div>
                        </div>

                        <div className="grid grid-cols-3 gap-4 mb-12 relative z-10">
                            {['CRM', 'EHR', 'RCM'].map((col, idx) => (
                                <button 
                                    key={col} 
                                    onClick={() => setActiveStep(idx)}
                                    className={`p-4 rounded-2xl border-2 text-left transition-all duration-500 ${activeStep === idx ? 'border-green-400 shadow-md bg-white' : 'border-transparent bg-white/20'}`}
                                >
                                    <div className="text-[10px] font-bold text-gray-500 mb-2 uppercase tracking-wider">{col}</div>
                                    <div className="space-y-2">
                                        <div className="h-1.5 w-full bg-gray-300 rounded opacity-50"></div>
                                        <div className="h-1.5 w-2/3 bg-gray-200 rounded opacity-50"></div>
                                    </div>
                                </button>
                            ))}
                        </div>

                        {/* Single Moving Card Container */}
                        <div className="flex-1 relative mt-4">
                            <div 
                                className="w-full max-w-[300px] bg-white rounded-2xl shadow-2xl p-8 border border-gray-100 absolute transition-all duration-700 ease-in-out"
                                style={{ 
                                    left: `${activeStep * 33.33}%`,
                                    zIndex: 20
                                }}
                            >
                                <div className="flex items-center gap-4 mb-8">
                                    <div className="w-14 h-14 bg-green-200 rounded-full flex items-center justify-center text-primary font-bold shadow-inner">
                                        <i className={`fas ${CONFIG.heroCards[activeStep].icon}`}></i>
                                    </div>
                                    <div className="flex-1">
                                        <div className="font-bold text-gray-900">{CONFIG.heroCards[activeStep].title}</div>
                                        <div className="text-[10px] text-gray-400 font-mono tracking-wider">{CONFIG.heroCards[activeStep].subtitle}</div>
                                    </div>
                                </div>
                                
                                <div className="space-y-6">
                                    {activeStep === 2 ? (
                                        <div className="text-center py-4">
                                            <div className="text-[10px] text-gray-400 uppercase tracking-widest font-bold mb-2">Net Collections</div>
                                            <div className="text-4xl font-serif text-primary mb-4">$225,390</div>
                                            <div className="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
                                                <div className="h-full bg-green-500 w-[85%]"></div>
                                            </div>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="h-4 w-full bg-gray-100 rounded mb-4"></div>
                                            <div className="h-4 w-2/3 bg-gray-50 rounded mb-8"></div>
                                        </>
                                    )}
                                    
                                    <div className="flex gap-2">
                                        <div className="h-8 px-4 bg-primary text-white text-[10px] font-bold flex items-center justify-center rounded-full">
                                            {CONFIG.heroCards[activeStep].cta}
                                        </div>
                                        {activeStep !== 2 && (
                                            <div className="h-8 px-4 border border-gray-100 text-gray-400 text-[10px] font-bold flex items-center justify-center rounded-full">
                                                More Actions
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Decorative background blurs */}
                        <div className="absolute -top-20 -right-20 w-64 h-64 bg-green-300/20 rounded-full blur-3xl pointer-events-none"></div>
                        <div className="absolute -bottom-20 -left-20 w-80 h-80 bg-green-400/10 rounded-full blur-3xl pointer-events-none"></div>
                    </div>
                </section>
            );
        };

        const LogoCloud = () => (
            <section className="py-24 border-y border-gray-100">
                <div className="max-w-7xl mx-auto px-6 text-center">
                    <p className="text-sm font-semibold uppercase tracking-widest text-gray-400 mb-12">Backed by leading investors</p>
                    <div className="flex flex-wrap justify-center items-center gap-12 md:gap-20 opacity-40 grayscale transition-all hover:opacity-100 hover:grayscale-0">
                        {CONFIG.investors.map(inv => (
                            <img key={inv.name} src={inv.logo} alt={inv.name} className="h-8 md:h-12 object-contain" />
                        ))}
                    </div>
                </div>
            </section>
        );

        const ClinicalSupport = () => {
            return (
                <section className="max-w-7xl mx-auto px-6 py-24 md:py-32 grid md:grid-cols-2 gap-20">
                    <div className="py-12 md:py-20">
                        <div className="space-y-6 md:space-y-10">
                            {CONFIG.specialties.map((spec, i) => (
                                <div key={spec} className="text-6xl md:text-8xl font-serif text-primary">
                                    {spec}
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="relative">
                        <div className="sticky top-40 space-y-12">
                            <div>
                                <span className="inline-block bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-xs font-semibold mb-4">{CONFIG.clinicalSupport.tagline}</span>
                                <p className="text-2xl text-primary leading-relaxed">
                                    {CONFIG.clinicalSupport.description}
                                </p>
                            </div>
                            <div className="grid grid-cols-2 gap-8">
                                {CONFIG.clinicalSupport.stats.map(stat => (
                                    <div key={stat.label}>
                                        <div className="text-5xl font-serif text-primary mb-2">{stat.value}</div>
                                        <div className="text-sm text-gray-500 font-medium">{stat.label}</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const ProblemSolution = () => {
            const sectionRef = useRef(null);
            const containerRef = useRef(null);
            const problemRef = useRef(null);
            const solutionRef = useRef(null);
            const svgRef = useRef(null);

            useEffect(() => {
                gsap.registerPlugin(ScrollTrigger);

                const paths = gsap.utils.toArray(".scroll-path");
                const centerY = 300;
                const width = 2000; // Large enough for all screens

                // Set initial paths
                paths.forEach((path, i) => {
                    const y = 100 + i * 80;
                    gsap.set(path, { attr: { d: `M 0 ${y} L ${width} ${y}` }, opacity: 0.2 });
                });

                const tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: sectionRef.current,
                        start: "top top",
                        end: "+=250%",
                        scrub: 1,
                        pin: true,
                        anticipatePin: 1
                    }
                });

                // 1. Lines fade in and scale
                tl.from(paths, 
                    { opacity: 0, scaleX: 0, duration: 1, stagger: 0.1, ease: "power2.out" }
                );

                // 2. Problem fades out, BG starts changing
                tl.to(problemRef.current, { opacity: 0, y: -40, duration: 1.5 }, "+=0.2");
                tl.to(sectionRef.current, { backgroundColor: "#BDE3C0", duration: 2 }, "<");

                // 3. Solution fades in
                tl.fromTo(solutionRef.current, 
                    { opacity: 0, y: 40 }, 
                    { opacity: 1, y: 0, duration: 1.5 },
                    "-=1"
                );

                // 4. Lines converge into a single horizontal line on the right
                paths.forEach((path, i) => {
                    const startY = 100 + i * 80;
                    tl.to(path, {
                        attr: { d: `M 0 ${startY} C ${width * 0.4} ${startY} ${width * 0.6} ${centerY} ${width} ${centerY}` },
                        duration: 2,
                        ease: "power2.inOut"
                    }, "converge");
                });

                tl.to(paths, { opacity: 0.8, strokeWidth: 2, duration: 1 }, "converge+=1");

                return () => {
                    ScrollTrigger.getAll().forEach(t => t.kill());
                };
            }, []);

            return (
                <div ref={sectionRef} className="h-screen overflow-hidden bg-white" id="problem-solution">
                    <div ref={containerRef} className="w-full h-full flex flex-col justify-center items-center relative transition-colors duration-1000 px-6">
                        
                        <div className="absolute inset-0 pointer-events-none overflow-hidden">
                            <svg ref={svgRef} className="w-full h-full" preserveAspectRatio="none" viewBox="0 0 2000 600">
                                {[...Array(6)].map((_, i) => (
                                    <path 
                                        key={i} 
                                        className="scroll-path" 
                                        fill="none" 
                                        stroke="#113320" 
                                        strokeWidth="1"
                                    />
                                ))}
                            </svg>
                        </div>

                        <div className="relative z-10 max-w-7xl w-full h-full text-left flex items-center justify-center px-6 md:px-24">
                            <div className="max-w-2xl relative w-full h-[400px]">
                                <div ref={problemRef} className="absolute inset-0 flex flex-col items-start justify-center w-full h-full">
                                    <span className="inline-block bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-xs font-semibold mb-6">{CONFIG.problemSolution.problem.title}</span>
                                    <h2 className="text-3xl md:text-5xl font-serif text-primary leading-tight">
                                        {CONFIG.problemSolution.problem.text}
                                    </h2>
                                </div>
                                
                                <div ref={solutionRef} className="absolute inset-0 opacity-0 flex flex-col items-start justify-center w-full h-full">
                                    <span className="inline-block bg-gray-200 text-gray-700 px-3 py-1 rounded-full text-xs font-semibold mb-6">{CONFIG.problemSolution.solution.title}</span>
                                    <h2 className="text-3xl md:text-5xl font-serif text-primary leading-tight">
                                        {CONFIG.problemSolution.solution.text}
                                    </h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const WhyEase = () => {
            const sectionRef = useRef(null);

            useEffect(() => {
                gsap.fromTo('.why-ease-card', 
                    { opacity: 0, y: 50 }, 
                    { 
                        opacity: 1, 
                        y: 0, 
                        duration: 0.8, 
                        stagger: 0.2, 
                        ease: 'power2.out',
                        scrollTrigger: {
                            trigger: sectionRef.current,
                            start: "top 80%",
                        }
                    }
                );
            }, []);

            return (
                <section ref={sectionRef} className="max-w-7xl mx-auto px-6 py-24 md:py-32">
                    <div className="text-center mb-20">
                        <span className="text-sm font-bold uppercase tracking-widest text-green-700 mb-4 block">{CONFIG.whyEase.tagline}</span>
                        <h2 className="text-4xl md:text-6xl font-serif text-primary max-w-3xl mx-auto">
                            {CONFIG.whyEase.headline}
                        </h2>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {CONFIG.whyEase.cards.map((card, i) => (
                            <div 
                                key={i} 
                                className="why-ease-card bg-green-50 p-10 rounded-[2.5rem] hover:bg-light-green transition-all duration-700 ease-out group"
                            >
                                <div className="w-14 h-14 bg-white rounded-2xl flex items-center justify-center mb-8 shadow-sm group-hover:scale-110 transition-transform duration-500">
                                    <i className={`fas ${card.icon} text-primary text-xl`}></i>
                                </div>
                                <h3 className="text-2xl font-serif text-primary mb-4">{card.title}</h3>
                                <p className="text-gray-600 leading-relaxed">
                                    {card.description}
                                </p>
                            </div>
                        ))}
                    </div>
                </section>
            );
        };
