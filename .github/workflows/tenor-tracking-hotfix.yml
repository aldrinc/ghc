            def find_json_object_end(text: str, start: int) -> int:
                depth = 0
                in_string = False
                escaped = False
                for index in range(start, len(text)):
                    char = text[index]
                    if in_string:
                        if escaped:
                            escaped = False
                        elif char == "\\":
                            escaped = True
                        elif char == '"':
                            in_string = False
                        continue
                    if char == '"':
                        in_string = True
                    elif char == "{":
                        depth += 1
                    elif char == "}":
                        depth -= 1
                        if depth == 0:
                            return index
                return -1

            def patch_runtime_config(text: str) -> str:
                marker_index = text.find(config_marker)
                if marker_index == -1:
                    raise RuntimeError("Standalone runtime config marker not found.")
                json_start = marker_index + len(config_marker)
                json_end = find_json_object_end(text, json_start)
                if json_end == -1:
                    raise RuntimeError("Standalone runtime config JSON end not found.")
                config = json.loads(text[json_start : json_end + 1])
                manifest = config.setdefault("manifest", {})
                bindings = manifest.setdefault("bindings", [])
                if not isinstance(bindings, list):
                    raise RuntimeError("Standalone runtime config manifest.bindings must be a list.")
                bindings[:] = [
                    binding
                    for binding in bindings
                    if not (isinstance(binding, dict) and binding.get("id") in klaviyo_binding_ids)
                ]
                bindings.extend(json.loads(json.dumps(tenor_klaviyo_email_capture_bindings())))
                patched_config = json.dumps(config, separators=(",", ":"), ensure_ascii=False)
                return text[:json_start] + patched_config + text[json_end + 1 :]

            def patch_html(path: Path) -> str:
                text = path.read_text(encoding="utf-8")
                if TARGET_PAGE_ID not in text or TARGET_PATH_HINT not in text:
                    return "skipped"
                original = text
                text = patch_runtime_config(text)
                if MARKER_START in text:
                    text = block_pattern.sub(SUPPLEMENTAL_SCRIPT, text, count=1)
                elif "</body>" in text:
                    text = text.replace("</body>", SUPPLEMENTAL_SCRIPT + "\n</body>", 1)
                else:
                    text = text + "\n" + SUPPLEMENTAL_SCRIPT
                if text == original:
                    return "unchanged"
                backup_path = BACKUP_ROOT / path.relative_to(SEARCH_ROOT)
                backup_path.parent.mkdir(parents=True, exist_ok=True)
                shutil.copy2(path, backup_path)
                path.write_text(text, encoding="utf-8")
                return "patched"

            if not SEARCH_ROOT.is_dir():
                raise SystemExit(f"Search root missing: {SEARCH_ROOT}")

            summary = {"patched": [], "unchanged": [], "skipped": 0, "backup_root": str(BACKUP_ROOT)}
            for html_path in sorted(SEARCH_ROOT.rglob("*.html")):
                try:
                    result = patch_html(html_path)
                except UnicodeDecodeError:
                    result = "skipped"
                if result == "patched":
                    summary["patched"].append(str(html_path))
                elif result == "unchanged":
                    summary["unchanged"].append(str(html_path))
                else:
                    summary["skipped"] += 1

            if not summary["patched"] and not summary["unchanged"]:
                raise SystemExit("No Tenor Daily Drive sales-page HTML files were patched.")

            print(json.dumps(summary, indent=2))
