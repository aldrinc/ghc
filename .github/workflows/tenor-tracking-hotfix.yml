name: Tenor Tracking Hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tenor-tracking-hotfix.yml
  workflow_dispatch:

jobs:
  patch-tenor-artifact:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Patch Tenor standalone tracking runtime through Cloudhand
        env:
          CLOUDHAND_API_BASE: https://self-deploy.moshq.app
          CLOUDHAND_API_KEY: ${{ secrets.CLOUDHAND_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDHAND_API_KEY:-}" ]; then
            echo "CLOUDHAND_API_KEY secret is required." >&2
            exit 1
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          API_BASE = os.environ["CLOUDHAND_API_BASE"].rstrip("/")
          API_KEY = os.environ["CLOUDHAND_API_KEY"]
          WORKLOAD_NAME = "tenor-tracking-hotfix"
          LIVE_URL = "https://shoptenorco.com/8b89a76d/be65d76e/presales?fbclid=deploycheck&utm_source=meta"

          PATCH_SCRIPT = r"""
          from __future__ import annotations

          import json
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          SITE_ROOT = Path("/opt/apps/brand-funnels-70124684-be65d76e/site")
          BACKUP_ROOT = SITE_ROOT.parent / (
              "tracking-wait-backup-" + datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          )

          CONSTANT_NEEDLE = '  const POSTHOG_INSTANCE_NAME = "mosFunnel";\n  const PRESALE_SOURCE_PARAM = "src";'
          CONSTANT_REPLACEMENT = (
              '  const POSTHOG_INSTANCE_NAME = "mosFunnel";\n'
              '  const META_ATTRIBUTION_WAIT_TIMEOUT_MS = 1500;\n'
              '  const META_ATTRIBUTION_WAIT_POLL_MS = 50;\n'
              '  const PRESALE_SOURCE_PARAM = "src";'
          )

          OLD_ATTRIBUTION_PROPS = '''  const resolveMetaAttributionProps = () => {
              const props = { action_source: "website" };
              assignCleanProp(props, "fbp", readCookie("_fbp"));
              assignCleanProp(props, "fbc", readCookie("_fbc"));
              const currentUrl = new URL(window.location.href);
              assignCleanProp(props, "fbclid", currentUrl.searchParams.get("fbclid"));
              assignCleanProp(props, "event_source_url", currentUrl.href);
              return props;
            };
          '''
          NEW_ATTRIBUTION_PROPS = '''  const resolveMetaAttributionProps = (eventSourceUrl) => {
              const props = { action_source: "website" };
              assignCleanProp(props, "fbp", readCookie("_fbp"));
              assignCleanProp(props, "fbc", readCookie("_fbc"));
              const currentUrl = new URL(cleanText(eventSourceUrl) || window.location.href);
              assignCleanProp(props, "fbclid", currentUrl.searchParams.get("fbclid"));
              assignCleanProp(props, "event_source_url", currentUrl.href);
              assignCleanProp(props, "$raw_user_agent", window.navigator && window.navigator.userAgent);
              return props;
            };
            const resolveMetaAttributionReady = (eventSourceUrl) => {
              const eventUrl = new URL(cleanText(eventSourceUrl) || window.location.href);
              const hasFbclid = Boolean(cleanText(eventUrl.searchParams.get("fbclid")));
              const hasFbp = Boolean(readCookie("_fbp"));
              const hasFbc = Boolean(readCookie("_fbc"));
              return hasFbp && (!hasFbclid || hasFbc);
            };
            const waitForMetaAttribution = (eventSourceUrl) => {
              const startedAt = Date.now();
              return new Promise((resolve) => {
                const poll = () => {
                  const elapsedMs = Date.now() - startedAt;
                  if (resolveMetaAttributionReady(eventSourceUrl)) {
                    resolve({ elapsedMs, timedOut: false });
                    return;
                  }
                  if (elapsedMs >= META_ATTRIBUTION_WAIT_TIMEOUT_MS) {
                    resolve({ elapsedMs, timedOut: true });
                    return;
                  }
                  window.setTimeout(poll, META_ATTRIBUTION_WAIT_POLL_MS);
                };
                window.setTimeout(poll, META_ATTRIBUTION_WAIT_POLL_MS);
              });
            };
          '''

          OLD_TRACK_POSTHOG = '''  const trackPostHogEvent = (eventType, props, mappedCaptures) => {
              const posthog = ensurePostHogInstance();
              if (!posthog || typeof posthog.capture !== "function") return;
              const baseEventProps = {
                productSlug: cleanText(config.productSlug),
                funnelSlug: cleanText(config.funnelSlug),
                publicationId: cleanText(config.publicationId),
                pageId: cleanText(config.pageId),
                pageSlug: cleanText(config.pageSlug),
                pageStage: cleanText((props && props.pageStage) || config.pageStage),
                visitorId: cleanText(visitorId),
                sessionId: cleanText(sessionId),
                path: window.location.pathname + window.location.search,
                referrer: document.referrer || undefined,
                utm: getUtmParams(),
              };
              const captures = resolvePostHogCaptures(eventType, props, baseEventProps, mappedCaptures);
              captures.forEach((capture) => {
                posthog.capture(capture.eventName, capture.eventProps);
              });
            };
          '''
          NEW_TRACK_POSTHOG = '''  const trackPostHogEvent = (eventType, props, mappedCaptures) => {
              const posthog = ensurePostHogInstance();
              if (!posthog || typeof posthog.capture !== "function") return;
              const eventSourceUrl = window.location.href;
              const baseEventProps = {
                productSlug: cleanText(config.productSlug),
                funnelSlug: cleanText(config.funnelSlug),
                publicationId: cleanText(config.publicationId),
                pageId: cleanText(config.pageId),
                pageSlug: cleanText(config.pageSlug),
                pageStage: cleanText((props && props.pageStage) || config.pageStage),
                visitorId: cleanText(visitorId),
                sessionId: cleanText(sessionId),
                path: window.location.pathname + window.location.search,
                referrer: document.referrer || undefined,
                utm: getUtmParams(),
              };
              const emitCaptures = (additionalEventProps) => {
                const captures = resolvePostHogCaptures(eventType, props, baseEventProps, mappedCaptures, eventSourceUrl);
                captures.forEach((capture) => {
                  posthog.capture(capture.eventName, {
                    ...capture.eventProps,
                    ...(additionalEventProps || {}),
                  });
                });
              };
              if (Array.isArray(mappedCaptures) && mappedCaptures.length && !resolveMetaAttributionReady(eventSourceUrl)) {
                waitForMetaAttribution(eventSourceUrl).then(({ elapsedMs, timedOut }) => {
                  emitCaptures({
                    meta_cookie_wait_ms: elapsedMs,
                    ...(timedOut ? { meta_cookie_wait_timed_out: true } : {}),
                  });
                });
                return;
              }
              emitCaptures();
            };
          '''

          def replace_once(text: str, old: str, new: str, label: str, path: Path) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one {label} block, found {count}")
              return text.replace(old, new, 1)

          def patch_html(path: Path) -> str:
              text = path.read_text(encoding="utf-8")
              if "MOS_STANDALONE_IMPORTED_HTML_BRIDGE_START" not in text:
                  return "skipped"
              if "resolveMetaAttributionProps" not in text:
                  return "skipped"
              if all(
                  marker in text
                  for marker in (
                      "waitForMetaAttribution",
                      "resolveMetaAttributionReady",
                      "meta_cookie_wait_ms",
                      "$raw_user_agent",
                      "META_ATTRIBUTION_WAIT_TIMEOUT_MS",
                  )
              ):
                  return "already_patched"

              original = text
              if "META_ATTRIBUTION_WAIT_TIMEOUT_MS" not in text:
                  text = replace_once(text, CONSTANT_NEEDLE, CONSTANT_REPLACEMENT, "attribution constants", path)
              if "resolveMetaAttributionReady" not in text:
                  text = replace_once(text, OLD_ATTRIBUTION_PROPS, NEW_ATTRIBUTION_PROPS, "attribution helpers", path)
              text = replace_once(text, OLD_TRACK_POSTHOG, NEW_TRACK_POSTHOG, "PostHog delayed capture", path)
              text = text.replace(
                  "  const resolvePostHogCaptures = (eventType, props, baseEventProps, providedMappedCaptures) => {",
                  "  const resolvePostHogCaptures = (eventType, props, baseEventProps, providedMappedCaptures, eventSourceUrl) => {",
                  1,
              )
              text = text.replace(
                  "        ...resolveMetaAttributionProps(),",
                  "        ...resolveMetaAttributionProps(eventSourceUrl),",
                  1,
              )

              required = (
                  "waitForMetaAttribution",
                  "resolveMetaAttributionReady",
                  "meta_cookie_wait_ms",
                  "$raw_user_agent",
                  "META_ATTRIBUTION_WAIT_TIMEOUT_MS",
                  "resolveMetaAttributionProps(eventSourceUrl)",
              )
              missing = [marker for marker in required if marker not in text]
              if missing:
                  raise RuntimeError(f"{path}: missing required markers after patch: {missing}")
              if text == original:
                  raise RuntimeError(f"{path}: patch produced no changes")

              backup_path = BACKUP_ROOT / path.relative_to(SITE_ROOT)
              backup_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, backup_path)
              path.write_text(text, encoding="utf-8")
              return "patched"

          if not SITE_ROOT.is_dir():
              raise SystemExit(f"Tenor site root missing: {SITE_ROOT}")

          summary = {"patched": [], "already_patched": [], "skipped": 0, "backup_root": str(BACKUP_ROOT)}
          for html_path in sorted(SITE_ROOT.rglob("*.html")):
              result = patch_html(html_path)
              if result == "patched":
                  summary["patched"].append(str(html_path))
              elif result == "already_patched":
                  summary["already_patched"].append(str(html_path))
              else:
                  summary["skipped"] += 1

          if not summary["patched"] and not summary["already_patched"]:
              raise SystemExit("No Tenor standalone HTML files were patchable.")

          print(json.dumps(summary, indent=2))
          """

          def request(method: str, path: str, payload: Any | None = None, query: dict[str, str] | None = None) -> Any:
              url = API_BASE + path
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              data = None
              headers = {"X-API-Key": API_KEY}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=1800) as response:
                      body = response.read().decode("utf-8").strip()
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{method} {path} failed with HTTP {exc.code}: {body}") from exc
              if not body:
                  return {}
              try:
                  return json.loads(body)
              except json.JSONDecodeError:
                  return {"raw": body}

          def fetch_public_url(url: str) -> str:
              req = urllib.request.Request(
                  url + f"&_deploy_probe={int(time.time() * 1000)}",
                  headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "mos-tenor-tracking-hotfix/1.0",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read().decode("utf-8", errors="replace")

          def extract_plan(payload: Any) -> dict[str, Any]:
              if isinstance(payload, dict) and isinstance(payload.get("new_spec"), dict):
                  return payload
              if isinstance(payload, dict) and isinstance(payload.get("content"), str):
                  parsed = json.loads(payload["content"])
                  if isinstance(parsed, dict) and isinstance(parsed.get("new_spec"), dict):
                      return parsed
              for key in ("plan", "data"):
                  value = payload.get(key) if isinstance(payload, dict) else None
                  if isinstance(value, dict) and isinstance(value.get("new_spec"), dict):
                      return value
                  if isinstance(value, dict) and isinstance(value.get("content"), str):
                      parsed = json.loads(value["content"])
                      if isinstance(parsed, dict) and isinstance(parsed.get("new_spec"), dict):
                          return parsed
              raise RuntimeError(f"Could not find new_spec in latest plan response keys: {sorted(payload.keys()) if isinstance(payload, dict) else type(payload).__name__}")

          def validate_apply_response(payload: Any) -> None:
              failure_patterns = (
                  "command failed:",
                  "apply failed with exit code",
                  "operation failed:",
                  "error: killed",
              )

              def walk(node: Any, path: str = "$") -> None:
                  if isinstance(node, dict):
                      for key in ("returncode", "exit_code", "exitCode"):
                          value = node.get(key)
                          if isinstance(value, int) and value != 0:
                              raise RuntimeError(f"Self Deploy reported non-zero {path}.{key}={value}")
                      for key in ("status", "conclusion"):
                          value = node.get(key)
                          if isinstance(value, str) and value.lower() in {"failed", "failure", "error"}:
                              raise RuntimeError(f"Self Deploy reported {path}.{key}={value!r}")
                      for key in ("logs", "stderr", "error", "detail", "message"):
                          value = node.get(key)
                          if not isinstance(value, str):
                              continue
                          lowered = value.lower()
                          for pattern in failure_patterns:
                              if pattern in lowered:
                                  raise RuntimeError(f"Self Deploy response contains failure signal {pattern!r} at {path}.{key}")
                      for key, value in node.items():
                          walk(value, f"{path}.{key}")
                      return
                  if isinstance(node, list):
                      for index, item in enumerate(node):
                          walk(item, f"{path}[{index}]")

              walk(payload)

          def put_plan(plan: dict[str, Any]) -> Any:
              return request("POST", "/api/applications/plans", {"content": json.dumps(plan, separators=(",", ":"))})

          def apply_workload() -> Any:
              response = request("POST", "/api/applications/plans/apply", {"workload_names": [WORKLOAD_NAME]})
              print(json.dumps(response, indent=2)[:30000])
              validate_apply_response(response)
              return response

          def build_workload() -> dict[str, Any]:
              install_command = "python3 - <<'REMOTE_PATCH_PY'\n" + PATCH_SCRIPT.strip() + "\nREMOTE_PATCH_PY"
              return {
                  "name": WORKLOAD_NAME,
                  "source_type": "git",
                  "repo_url": "https://github.com/aldrinc/ghc.git",
                  "branch": "main",
                  "runtime": "static",
                  "destination_path": "/opt/apps",
                  "build_config": {
                      "install_command": install_command,
                      "build_command": "mkdir -p /tmp/tenor-tracking-hotfix-static && printf ok > /tmp/tenor-tracking-hotfix-static/index.html",
                      "system_packages": [],
                  },
                  "service_config": {
                      "command": None,
                      "static_root": "/tmp/tenor-tracking-hotfix-static",
                      "spa_fallback": False,
                      "environment": {},
                      "ports": [],
                      "server_names": [],
                      "https": False,
                  },
                  "workspace_server_names": [],
              }

          def upsert_hotfix_workload(plan: dict[str, Any]) -> str:
              instances = plan.get("new_spec", {}).get("instances")
              if not isinstance(instances, list) or not instances:
                  raise RuntimeError("Latest Cloudhand plan has no instances.")
              instance = instances[0]
              instance_name = str(instance.get("name") or "").strip()
              workloads = instance.setdefault("workloads", [])
              if not isinstance(workloads, list):
                  raise RuntimeError(f"Instance {instance_name or '<unnamed>'} workloads is not a list.")
              workload = build_workload()
              for index, existing in enumerate(workloads):
                  if isinstance(existing, dict) and existing.get("name") == WORKLOAD_NAME:
                      workloads[index] = workload
                      break
              else:
                  workloads.append(workload)
              return instance_name

          def remove_hotfix_workload(plan: dict[str, Any]) -> bool:
              removed = False
              for instance in plan.get("new_spec", {}).get("instances", []):
                  if not isinstance(instance, dict):
                      continue
                  workloads = instance.get("workloads")
                  if not isinstance(workloads, list):
                      continue
                  kept = [workload for workload in workloads if not (isinstance(workload, dict) and workload.get("name") == WORKLOAD_NAME)]
                  if len(kept) != len(workloads):
                      instance["workloads"] = kept
                      removed = True
              return removed

          def verify_live_page() -> None:
              required = (
                  "waitForMetaAttribution",
                  "resolveMetaAttributionReady",
                  "meta_cookie_wait_ms",
                  "$raw_user_agent",
                  "META_ATTRIBUTION_WAIT_TIMEOUT_MS",
                  "resolveMetaAttributionProps(eventSourceUrl)",
              )
              missing: list[str] = []
              for attempt in range(1, 13):
                  html = fetch_public_url(LIVE_URL)
                  missing = [marker for marker in required if marker not in html]
                  if not missing:
                      print(f"Live Tenor page contains all tracking-delay markers on attempt {attempt}.")
                      return
                  print(f"Live verification attempt {attempt}/12 missing markers: {missing}")
                  time.sleep(10)
              raise RuntimeError(f"Live Tenor page is missing tracking-delay markers after deploy: {missing}")

          print("Fetching latest Cloudhand plan.")
          original_plan = extract_plan(request("GET", "/api/applications/plans/latest"))
          plan = json.loads(json.dumps(original_plan))
          instance_name = upsert_hotfix_workload(plan)
          print(f"Saving temporary workload {WORKLOAD_NAME!r} on instance {instance_name!r}.")
          put_plan(plan)

          apply_completed = False
          try:
              print(f"Applying temporary workload {WORKLOAD_NAME!r}.")
              apply_response = apply_workload()
              apply_completed = True
              verify_live_page()
          finally:
              print(f"Removing temporary workload {WORKLOAD_NAME!r} from the deployment plan.")
              cleanup_plan = extract_plan(request("GET", "/api/applications/plans/latest"))
              if remove_hotfix_workload(cleanup_plan):
                  put_plan(cleanup_plan)
                  if apply_completed:
                      try:
                          apply_workload()
                      except Exception as exc:
                          print(f"Cleanup apply failed after live patch verification: {exc}", flush=True)
                  else:
                      print("Deploy apply did not complete, so cleanup only removed the temporary workload from the saved plan.")
              else:
                  print("Temporary workload was already absent from the latest plan.")

          verify_live_page()
          print("Tenor tracking hotfix deployed and verified.")
          PY
