name: Self Deploy

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: self-deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Check upstream CI/CD result
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ENABLE_PRODUCTION_CD: ${{ vars.ENABLE_PRODUCTION_CD }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${UPSTREAM_EVENT}" != "push" ] || [ "${UPSTREAM_BRANCH}" != "main" ]; then
            echo "Self Deploy ignores CI/CD runs from event=${UPSTREAM_EVENT} branch=${UPSTREAM_BRANCH}."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${ENABLE_PRODUCTION_CD}" != "true" ]; then
            echo "ENABLE_PRODUCTION_CD is not true; skipping automatic production deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${UPSTREAM_CONCLUSION}" != "success" ]; then
            echo "Upstream CI/CD concluded with '${UPSTREAM_CONCLUSION}'. Production deploy is blocked." >&2
            exit 1
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  apply:
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          CLOUDHAND_API_KEY: ${{ secrets.CLOUDHAND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDHAND_API_KEY:-}" ]; then
            echo "CLOUDHAND_API_KEY secret is required." >&2
            exit 1
          fi

      - name: Apply deployment plan
        env:
          CLOUDHAND_API_KEY: ${{ secrets.CLOUDHAND_API_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          http_code="$(
            curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --request POST "https://self-deploy.moshq.app/api/applications/plans/apply" \
            --header "Content-Type: application/json" \
            --header "X-API-Key: ${CLOUDHAND_API_KEY}" \
            --data '{"plan_path": "/opt/apps/cloudhand-deploy/cloudhand/plan-2026-02-05T00-23-54Z.json"}'
          )"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "Self Deploy API returned HTTP ${http_code}." >&2
            cat "${response_file}"
            exit 1
          fi

          python - "${response_file}" <<'PY'
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])
          payload_text = response_path.read_text(encoding="utf-8").strip()
          if not payload_text:
              raise SystemExit("Self Deploy API returned an empty response.")

          try:
              payload = json.loads(payload_text)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Self Deploy API returned non-JSON output: {exc}") from exc

          failure_patterns = (
              "command failed:",
              "apply failed with exit code",
              "operation failed:",
              "error: killed",
          )

          def walk(node, path="$"):
              if isinstance(node, dict):
                  for key in ("returncode", "exit_code", "exitCode"):
                      value = node.get(key)
                      if isinstance(value, int) and value != 0:
                          raise SystemExit(f"Self Deploy reported non-zero {path}.{key}={value}")

                  for key in ("status", "conclusion"):
                      value = node.get(key)
                      if isinstance(value, str) and value.lower() in {"failed", "failure", "error"}:
                          raise SystemExit(f"Self Deploy reported {path}.{key}={value!r}")

                  for key in ("logs", "stderr", "error", "detail", "message"):
                      value = node.get(key)
                      if not isinstance(value, str):
                          continue
                      lowered = value.lower()
                      for pattern in failure_patterns:
                          if pattern in lowered:
                              raise SystemExit(
                                  f"Self Deploy response contains failure signal {pattern!r} at {path}.{key}"
                              )

                  for key, value in node.items():
                      walk(value, f"{path}.{key}")
                  return

              if isinstance(node, list):
                  for index, item in enumerate(node):
                      walk(item, f"{path}[{index}]")

          walk(payload)
          print(json.dumps(payload, indent=2))
          PY
