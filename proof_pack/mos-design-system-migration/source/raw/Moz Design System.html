  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ── Brand ───────────────────────────────────────────────── */\n  --moz-blue-50:  #EFF4FF;\n  --moz-blue-100: #DBE6FE;\n  --moz-blue-200: #BFD3FE;\n  --moz-blue-300: #93B4FD;\n  --moz-blue-400: #608AFA;\n  --moz-blue-500: #3B6AF6;\n  --moz-blue-600: #2563EB;   /* primary */\n  --moz-blue-700: #1D4FD8;\n  --moz-blue-800: #1E40AF;\n  --moz-blue-900: #1E3A8A;\n  --moz-blue-950: #172554;\n\n  --moz-blue:    var(--moz-blue-600);\n\n  /* ── Ink (cool black + neutrals) ─────────────────────────── */\n  --ink:         #0B0D12;\n  --ink-soft:    #15181F;\n  --ink-mute:    #2A2F3A;\n\n  --slate-50:    #F7F8FA;\n  --slate-100:   #F0F2F6;\n  --slate-200:   #E3E6EE;\n  --slate-300:   #CDD2DD;\n  --slate-400:   #99A1B3;\n  --slate-500:   #6B7280;\n  --slate-600:   #4B5260;\n  --slate-700:   #353A45;\n  --slate-800:   #1F232C;\n  --slate-900:   #0B0D12;\n\n  /* ── Surfaces ────────────────────────────────────────────── */\n  --bg:           #FFFFFF;\n  --bg-soft:      #F8FAFC;\n  --bg-tint:      #F4F7FB;     /* very light blue wash */\n  --bg-paper:     #FFFFFF;     /* elevated / pure white (inputs, dropdowns) */\n  --border:       #E6E9F0;\n  --border-soft:  #EEF0F5;\n\n  /* ── Semantic ────────────────────────────────────────────── */\n  --success:    #10B981;\n  --success-bg: #E7F8F1;\n  --warning:    #F59E0B;\n  --warning-bg: #FEF4DE;\n  --danger:     #EF4444;\n  --danger-bg:  #FEECEC;\n  --info:       var(--moz-blue-600);\n  --info-bg:    var(--moz-blue-50);\n\n  /* ── Typography ──────────────────────────────────────────── */\n  --font-display: \"Libre Baskerville\", \"Source Serif Pro\", Georgia, serif;\n  --font-sans:    \"DM Sans\", ui-sans-serif, system-ui, -apple-system, sans-serif;\n\n  /* Type scale — serif display large, DM Sans body normal */\n  --text-2xs:  11px;\n  --text-xs:   12px;\n  --text-sm:   13px;\n  --text-md:   15px;\n  --text-base: 16px;\n  --text-lg:   18px;\n  --text-xl:   21px;\n  --text-2xl:  26px;\n  --text-3xl:  34px;\n  --text-4xl:  44px;\n  --text-5xl:  56px;\n  --text-6xl:  72px;\n  --text-7xl:  92px;\n\n  /* Letter spacing */\n  --tracking-tight:   -0.02em;\n  --tracking-tighter: -0.035em;\n  --tracking-normal:  0;\n  --tracking-wide:    0.04em;\n  --tracking-caps:    0.08em;\n\n  /* Line heights */\n  --lh-tight:   1.02;\n  --lh-snug:    1.15;\n  --lh-normal:  1.4;\n  --lh-relaxed: 1.55;\n  --lh-loose:   1.7;\n\n  /* ── Spacing scale (4-based) ─────────────────────────────── */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-7:  32px;\n  --space-8:  40px;\n  --space-9:  48px;\n  --space-10: 64px;\n  --space-11: 80px;\n  --space-12: 96px;\n  --space-13: 128px;\n\n  /* ── Radii ───────────────────────────────────────────────── */\n  --radius-xs:  4px;\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  14px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n\n  /* ── Shadows (soft, layered) ─────────────────────────────── */\n  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);\n  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 1px 3px rgba(15, 23, 42, 0.04);\n  --shadow-md: 0 2px 4px rgba(15, 23, 42, 0.04), 0 6px 16px rgba(15, 23, 42, 0.06);\n  --shadow-lg: 0 8px 24px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);\n  --shadow-xl: 0 24px 56px rgba(15, 23, 42, 0.12), 0 8px 16px rgba(15, 23, 42, 0.05);\n\n  --shadow-blue:  0 8px 24px rgba(37, 99, 235, 0.22);\n  --shadow-blue-lg: 0 16px 40px rgba(37, 99, 235, 0.28);\n  --shadow-ink:  0 8px 24px rgba(11, 13, 18, 0.18);\n\n  /* ── Motion ──────────────────────────────────────────────── */\n  --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:   140ms;\n  --dur-base:   220ms;\n  --dur-slow:   420ms;\n}\n\n/* ── Base reset / globals ─────────────────────────────────── */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--text-base);\n  line-height: 1.55;\n  color: var(--ink);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headings use serif display */\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  letter-spacing: -0.01em;\n}\nh1 em, h2 em, h3 em, h4 em, h5 em, h6 em {\n  font-style: italic;\n  font-weight: 400;\n}\nimg { display: block; max-width: 100%; }\nbutton { font: inherit; }\na { color: inherit; text-decoration: none; }\n\n::selection {\n  background: var(--moz-blue-200);\n  color: var(--ink);\n}\n<\u002Fstyle>\n<style>/* ──────────────────────────────────────────────────────────\n   Moz — Components\n   Buttons, cards, inputs, chat, badges, nav, footer.\n   ────────────────────────────────────────────────────────── */\n\n/* ═══ Layout primitives ═══════════════════════════════════ */\n\n.page {\n  width: 100%;\n  max-width: 1240px;\n  margin: 0 auto;\n  padding: 0 var(--space-8);\n}\n\n.section {\n  padding: var(--space-12) 0;\n  border-top: 1px solid var(--border);\n}\n.section:first-of-type { border-top: 0; }\n\n.section-eyebrow {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--space-2);\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--moz-blue-700);\n  margin-bottom: var(--space-4);\n}\n.section-eyebrow::before {\n  content: \"\";\n  width: 22px;\n  height: 1px;\n  background: var(--moz-blue-600);\n}\n\n.section-title {\n  font-size: var(--text-4xl);\n  font-weight: 600;\n  letter-spacing: var(--tracking-tighter);\n  line-height: var(--lh-snug);\n  margin: 0 0 var(--space-3);\n  color: var(--ink);\n  text-wrap: balance;\n}\n\n.section-subtitle {\n  font-size: var(--text-lg);\n  color: var(--slate-600);\n  max-width: 60ch;\n  margin: 0 0 var(--space-9);\n  line-height: var(--lh-relaxed);\n  text-wrap: pretty;\n}\n\n.section-head {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-end;\n  gap: var(--space-8);\n  margin-bottom: var(--space-9);\n  flex-wrap: wrap;\n}\n.section-head .section-subtitle { margin-bottom: 0; }\n\n/* ═══ Buttons ═════════════════════════════════════════════ */\n\n.btn {\n  /* Primary = flat black ink. Pill shape, bold text, halo-ring hover. */\n  --btn-bg: var(--ink);\n  --btn-fg: #fff;\n  --btn-border: var(--ink);\n  --btn-halo: rgba(11, 13, 18, 0.12);     /* ink halo for ink button */\n  --btn-ring: rgba(11, 13, 18, 0.20);\n\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  border: 1px solid var(--btn-border);\n  background: var(--btn-bg);\n  color: var(--btn-fg);\n  padding: 0 22px;\n  height: 46px;\n  font-family: var(--font-sans);\n  font-size: 15px;\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  border-radius: 999px;\n  cursor: pointer;\n  white-space: nowrap;\n  isolation: isolate;\n  user-select: none;\n  transition: background var(--dur-fast) var(--ease-out),\n              border-color var(--dur-fast) var(--ease-out),\n              color var(--dur-fast) var(--ease-out),\n              transform var(--dur-fast) var(--ease-out),\n              box-shadow var(--dur-base) var(--ease-out);\n}\n.btn .btn-icon-arrow { transition: transform var(--dur-base) var(--ease-out); }\n\n/* HOVER: pulsing tinted halo + tiny scale-up. No gradient washes, no color flip. */\n.btn:hover {\n  box-shadow: 0 0 0 4px var(--btn-halo);\n  transform: scale(1.015);\n}\n.btn:hover .btn-icon-arrow { transform: translateX(3px); }\n.btn:active {\n  transform: scale(0.98);\n  box-shadow: 0 0 0 2px var(--btn-halo);\n}\n.btn:focus-visible {\n  outline: none;\n  box-shadow: 0 0 0 4px var(--btn-ring);\n}\n\n.btn--blue {\n  --btn-bg: var(--moz-blue-600);\n  --btn-fg: #fff;\n  --btn-border: var(--moz-blue-600);\n  --btn-halo: rgba(37, 99, 235, 0.30);\n  --btn-ring: rgba(37, 99, 235, 0.35);\n}\n\n.btn--ghost {\n  --btn-bg: transparent;\n  --btn-fg: var(--ink);\n  --btn-border: var(--slate-300);\n  --btn-halo: rgba(11, 13, 18, 0.08);\n  --btn-ring: rgba(11, 13, 18, 0.10);\n}\n.btn--ghost:hover { border-color: var(--ink); }\n\n.btn--link {\n  --btn-bg: transparent;\n  --btn-fg: var(--ink);\n  --btn-border: transparent;\n  padding-left: 6px;\n  padding-right: 6px;\n  height: auto;\n  border-radius: var(--radius-sm);\n  font-weight: 600;\n  overflow: visible;\n}\n.btn--link:hover { box-shadow: none; transform: none; }\n.btn--link::after {\n  content: \"\";\n  position: absolute;\n  left: 6px; right: 6px;\n  bottom: -3px;\n  height: 1.5px;\n  background: currentColor;\n  opacity: 0.35;\n  transform-origin: left;\n  transform: scaleX(0.5);\n  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-base) var(--ease-out);\n}\n.btn--link:hover::after { opacity: 1; transform: scaleX(1); }\n\n.btn--sm { height: 36px; padding: 0 16px; font-size: 13px; }\n.btn--lg { height: 54px; padding: 0 28px; font-size: 16px; }\n.btn--xl { height: 64px; padding: 0 32px; font-size: 17px; gap: 10px; }\n\n.btn[aria-disabled=\"true\"], .btn:disabled {\n  opacity: 0.5;\n  cursor: not-allowed;\n  transform: none !important;\n}\n\n/* ═══ Cards ═══════════════════════════════════════════════ */\n\n.card {\n  background: var(--bg);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-xl);\n  padding: var(--space-7);\n  transition: border-color var(--dur-base) var(--ease-out),\n              background var(--dur-base) var(--ease-out);\n}\n.card:hover {\n  border-color: var(--slate-300);\n  background: var(--bg-soft);\n}\n\n.card--feature {\n  display: flex;\n  flex-direction: column;\n  gap: var(--space-4);\n}\n.card--feature .card-icon {\n  width: 44px; height: 44px;\n  border-radius: var(--radius-md);\n  backgroun ter-spacing: -0.005em;\n  color: var(--ink);\n  cursor: pointer;\n  text-align: left;\n  transition: background var(--dur-fast) var(--ease-out);\n}\n.autocomplete-row:hover,\n.autocomplete-row.is-focused { background: var(--slate-100); }\n.autocomplete-cat {\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--slate-500);\n}\n.autocomplete-empty {\n  padding: 22px 14px;\n  font-size: 13px;\n  color: var(--slate-500);\n  text-align: center;\n}\n\n/* ═══ Tooltips ═══════════════════════════════════════════ */\n.tooltip-trigger {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n}\n.help-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 16px; height: 16px;\n  border-radius: 50%;\n  background: var(--slate-100);\n  color: var(--slate-500);\n  cursor: help;\n  margin-left: 6px;\n  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);\n}\n.help-icon:hover { background: var(--slate-200); color: var(--ink); }\n.help-icon svg { width: 10px; height: 10px; }\n\n.tooltip {\n  position: absolute;\n  bottom: calc(100% + 10px);\n  left: 50%;\n  transform: translateX(-50%) translateY(4px);\n  background: var(--ink);\n  color: white;\n  font-family: var(--font-sans);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  padding: 8px 12px;\n  border-radius: 8px;\n  white-space: nowrap;\n  pointer-events: none;\n  z-index: 30;\n  opacity: 0;\n  visibility: hidden;\n  transition: opacity 0.15s var(--ease-out),\n              visibility 0.15s var(--ease-out),\n              transform 0.18s var(--ease-out);\n}\n.tooltip-trigger:hover .tooltip,\n.tooltip-trigger:focus .tooltip,\n.tooltip-trigger:focus-within .tooltip {\n  opacity: 1;\n  visibility: visible;\n  transform: translateX(-50%) translateY(0);\n}\n.tooltip--right {\n  bottom: auto;\n  top: 50%;\n  left: calc(100% + 10px);\n  transform: translateY(-50%) translateX(4px);\n}\n.tooltip-trigger:hover .tooltip--right,\n.tooltip-trigger:focus .tooltip--right,\n.tooltip-trigger:focus-within .tooltip--right {\n  transform: translateY(-50%) translateX(0);\n}\n.tooltip::after {\n  content: \"\";\n  position: absolute;\n  top: 100%;\n  left: 50%;\n  transform: translateX(-50%);\n  border: 5px solid transparent;\n  border-top-color: var(--ink);\n}\n.tooltip--multiline {\n  white-space: normal;\n  width: 240px;\n  text-align: left;\n  font-weight: 400;\n  line-height: 1.5;\n  padding: 10px 12px;\n}\n.tooltip--multiline strong { font-weight: 600; display: block; margin-bottom: 2px; }\n.tooltip--right::after {\n  top: 50%;\n  left: auto;\n  right: 100%;\n  transform: translateY(-50%);\n  border-top-color: transparent;\n  border-right-color: var(--ink);\n}\n\n/* Chips */\n.chip {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 0 12px;\n  height: 30px;\n  font-family: var(--font-sans);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: -0.005em;\n  color: var(--slate-700);\n  background: var(--bg);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-pill);\n  cursor: pointer;\n  white-space: nowrap;\n  transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);\n}\n.chip:hover { border-color: var(--slate-400); color: var(--ink); }\n.chip.is-active {\n  background: var(--ink);\n  color: white;\n  border-color: var(--ink);\n  padding-right: 6px;\n}\n.chip--blue.is-active {\n  background: var(--moz-blue-600);\n  border-color: var(--moz-blue-600);\n}\n\n/* Inline X glyph (no button chrome — sits inside an active chip) */\n.chip-remove {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 18px; height: 18px;\n  margin-left: 2px;\n  border: 0;\n  background: transparent;\n  border-radius: 50%;\n  color: currentColor;\n  opacity: 0.7;\n  cursor: pointer;\n  padding: 0;\n  transition: opacity var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);\n}\n.chip-remove:hover { opacity: 1; background: rgba(255,255,255,0.18); }\n.chip-remove svg { width: 10px; height: 10px; stroke: currentColor; }\n\n/* ═══ Badges / Pills / Tags ═══════════════════════════════ */\n\n.badge {\n  display: inline-flex; align-items: center; gap: var(--space-2);\n  padding: 2px var(--space-2);\n  height: 22px;\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  letter-spacing: -0.002em;\n  white-space: nowrap;\n  border-radius: var(--radius-sm);\n  background: var(--slate-100);\n  color: var(--slate-700);\n  border: 1px solid var(--slate-200);\n}\n.badge--blue   { background: var(--moz-blue-50); color: var(--moz-blue-800); border-color: var(--moz-blue-100); }\n.badge--ink    { background: var(--ink); color: white; border-color: var(--ink); }\n.badge--success { background: var(--success-bg); color: #065F46; border-color: #C0EDDC; }\n.badge--warning { background: var(--warning-bg); color: #92400E; border-color: #FCE5A5; }\n.badge--danger  { background: var(--danger-bg); color: #991B1B; border-color: #FBC9C9; }\n\n.dot {\n  display: inline-block;\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  background: var(--slate-400);\n}\n.dot--blue { background: var(--moz-blue-600); box-shadow: 0 0 0 3px var(--moz-blue-100); }\n.dot--live { background: var(--success); box-shadow: 0 0 0 3px var(--success-bg); animation: dot-pulse 1.8s var(--ease-in-out) infinite; }\n.dot--warn { background: var(--warning); }\n\n@keyframes dot-pulse {\n  0%, 100% { box-shadow: 0 0 0 3px var(--success-bg); }\n  50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.15); }\n}\n\n.status-tag {\n  display: inline-flex; align-items: center; gap: var(--space-2);\n  height: 26px;\n  padding: 0 var(--space-3);\n  border-radius: var(--radius-pill);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  background: var(--bg-soft);\n  border: 1px solid dius: 4px;\n}\n.typing span {\n  width: 6px; height: 6px;\n  border-radius: 50%;\n  background: var(--slate-400);\n  animation: typing-bounce 1.2s var(--ease-in-out) infinite;\n}\n.typing span:nth-child(2) { animation-delay: 0.15s; }\n.typing span:nth-child(3) { animation-delay: 0.3s; }\n\n@keyframes typing-bounce {\n  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }\n  30% { transform: translateY(-4px); opacity: 1; }\n}\n\n/* ═══ Nav ═════════════════════════════════════════════════ */\n\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 20;\n  background: rgba(255, 255, 255, 0.85);\n  backdrop-filter: saturate(180%) blur(12px);\n  -webkit-backdrop-filter: saturate(180%) blur(12px);\n  border-bottom: 1px solid var(--border-soft);\n}\n.nav-inner {\n  display: flex; align-items: center; justify-content: space-between;\n  height: 64px;\n}\n.nav-links {\n  display: flex; align-items: center; gap: var(--space-7);\n  font-size: var(--text-sm);\n  color: var(--slate-600);\n}\n.nav-links a { transition: color var(--dur-fast) var(--ease-out); }\n.nav-links a:hover { color: var(--ink); }\n.nav-cta { display: flex; align-items: center; gap: var(--space-3); }\n\n/* ═══ Footer ══════════════════════════════════════════════ */\n\n.footer {\n  border-top: 1px solid var(--border);\n  padding: var(--space-12) 0 var(--space-9);\n  background: var(--bg-soft);\n}\n.footer-grid {\n  display: grid;\n  grid-template-columns: 1.4fr repeat(4, 1fr);\n  gap: var(--space-9);\n}\n.footer-brand p {\n  font-size: var(--text-sm);\n  color: var(--slate-600);\n  max-width: 36ch;\n  margin: var(--space-4) 0 var(--space-6);\n  line-height: var(--lh-relaxed);\n}\n.footer-col h4 {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--slate-500);\n  margin: 0 0 var(--space-5);\n}\n.footer-col ul {\n  list-style: none; padding: 0; margin: 0;\n  display: flex; flex-direction: col dding: var(--space-5) 0;\n  border-bottom: 1px solid var(--border-soft);\n}\n.type-row:last-child { border-bottom: 0; }\n.type-row .label {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  color: var(--slate-500);\n}\n.type-row .specs {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  color: var(--slate-500);\n  text-align: right;\n}\n\n.spec-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));\n  gap: var(--space-5);\n}\n.spec-card {\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  padding: var(--space-5);\n  display: flex; flex-direction: column; gap: var(--space-3);\n  background: var(--bg);\n}\n.spec-card .demo { min-height: 60px; display: flex; align-items: center; justify-content: center; }\n.spec-card .label { font-size: var(--text-xs); font-weight: 600; color: var(--ink); }\n.spec-card .token { font-family: var(--font-sans); font-size: var(--text-2xs); color: var(--slate-500); }\n\n.demo-frame {\n  border: 1px solid var(--border);\n  border-radius: var(--radius-xl);\n  background: var(--bg);\n  padding: var(--space-8);\n  position: relative;\n}\n.demo-frame::before {\n  content: attr(data-label);\n  position: absolute;\n  top: -10px; left: var(--space-6);\n  background: var(--bg);\n  padding: 0 var(--space-2);\n  font-family: var(--font-sans);\n  font-size: var(--text-2xs);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n  color: var(--slate-500);\n}\n\n.row { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }\n.col { display: flex; flex-direction: column; gap: var(--space-3); }\n.stack-lg { display: flex; flex-direction: column; gap: var(--space-8); }\n.stack-md { display: flex; flex-direction: column; gap: var(--space-5); }\n\n.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }\n.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-5); }\n.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-5); }\n\n@media (max-width: 900px) {\n  .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }\n  .footer-grid { grid-template-columns: 1fr 1fr; }\n}\n@media (max-width: 640px) {\n  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }\n  .footer-grid { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<style>/* ──────────────────────────────────────────────────────────\n   Moz — Design system SHOWCASE styles\n   Page-only layout — not part of the design system itself.\n   ────────────────────────────────────────────────────────── */\n\n/* ─── Logo lockup ─────────────────────────────────────────── */\n.logo-lockup {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 10px;\n  line-height: 1;\n  color: var(--ink);\n  white-space: nowrap;\n}\n.logo-mark {\n  display: inline-flex;\n  align-items: flex-end;\n  justify-content: flex-start;\n  color: var(--ink);\n  flex-shrink: 0;\n  line-height: 0;\n}\n.logo-mark svg {\n  height: 100%;\n  width: auto;\n  display: block;\n}\n/* Sizes — height drives scale; width is auto from the SVG aspect (≈ 60:28) */\n.logo-mark              { height: 22px; }\n.logo-mark--sm          { height: 16px; }\n.logo-mark--md          { height: 22px; }\n.logo-mark--lg          { height: 40px; }\n.logo-mark--xl          { height: 96px; }\n\n.wordmark {\n  font-family: var(--font-sans);\n  font-size: 30px;\n  font-weight: 600;\n  letter-spacing: -0.04em;\n  line-height: 1;\n  color: var(--ink);\n  text-transform: lowercase;\n  font-feature-settings: \"kern\", \"ss01\";\n}\n.wordmark--sm { font-size: 22px; }\n.wordmark--md { font-size: 30px; }\n.wordmark--lg { font-size: 60px; }\n\n.logo-lockup--lg { gap: 14px; }\n.logo-lockup--lg .logo-mark { height: 42px; }\n\n/* ─── Hero ────────────────────────────────────────────────── */\n.hero {\n  padding: var(--space-12) 0 var(--space-11);\n  border-bottom: 1px solid var(--border);\n  position: relative;\n  overflow: hidden;\n}\
