(--slate-500);\n}\n.campaign-list {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n  border-top: 1px solid var(--border-soft);\n  border-bottom: 1px solid var(--border-soft);\n}\n.campaign-list li {\n  display: grid;\n  grid-template-columns: 14px 1fr auto;\n  align-items: center;\n  gap: var(--space-4);\n  padding: 14px 0;\n  border-top: 1px solid var(--border-soft);\n}\n.campaign-list li:first-child { border-top: 0; }\n.campaign-status {\n  width: 10px; height: 10px;\n  border-radius: 50%;\n  flex-shrink: 0;\n}\n.campaign-status.done    { background: var(--ink); }\n.campaign-status.live    { background: var(--success); box-shadow: 0 0 0 4px rgba(16,185,129,0.12); }\n.campaign-status.running { background: var(--moz-blue-600); }\n.campaign-status.queued  { background: transparent; border: 1.5px dashed var(--slate-400); }\n.campaign-title {\n  font-size: 14px;\n  color: var(--ink);\n  font-weight: 500;\n  min-width: 0;\n}\n.campaign-meta {\n  font-size: 12px;\n  color: var(--slate-500);\n  font-variant-numeric: tabular-nums;\n  white-space: nowrap;\n}\n.campaign-foot {\n  display: flex;\n  justify-content: space-between;\n  font-size: 13px;\n  color: var(--slate-600);\n}\n.campaign-foot strong { color: var(--ink); font-weight: 600; }\n\n/* Field anatomy diagram */\n.anatomy-row {\n  display: flex;\n  gap: 20px;\n  align-items: flex-start;\n}\n.anatomy-tag {\n  flex-shrink: 0;\n  width: 26px;\n  height: 26px;\n  border-radius: 50%;\n  background: var(--ink);\n  color: white;\n  font-family: var(--font-sans);\n  font-size: 12px;\n  font-weight: 600;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin-top: 4px;\n}\n.anatomy-callout {\n  display: inline-flex;\n  align-items: center;\n  height: 18px;\n  padding: 0 7px;\n  font-family: var(--font-sans);\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  color: var(--moz-blue-700);\n  background: var(--moz-blue-50);\n  border-radius: 4px;\n  margin-left: 8px;\n  vertical-align: middle;\n}\n\n/* ─── Mark exploration ────────────────────────────────────── */\n.mark-explore {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: var(--space-4);\n  margin-top: var(--space-7);\n}\n.mark-tile {\n  border: 1px solid var(--border);\n  border-radius: var(--radius-xl);\n  background: var(--bg-paper);\n  aspect-ratio: 1;\n  display: flex;\n  flex-direction: column;\n  position: relative;\n  overflow: hidden;\n  transition: border-color var(--dur-base) var(--ease-out),\n              background var(--dur-base) var(--ease-out);\n  cursor: pointer;\n}\n.mark-tile:hover {\n  border-color: var(--ink);\n  background: var(--bg-soft);\n}\n.mark-tile-art {\n  flex: 1;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  color: var(--ink);\n  padding: var(--space-7);\n}\n.mark-tile-art svg { width: 65%; height: auto; }\n.mark-tile-foot {\n  padding: 14px 18px;\n  border-top: 1px solid var(--border-soft);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n}\n.mark-tile-letter {\n  font-family: var(--font-sans);\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--slate-500);\n}\n.mark-tile-name {\n  font-family: var(--font-sans);\n  font-size: 13px;\n  font-weight: 500;\n  color: var(--ink);\n  letter-spacing: -0.005em;\n}\n.mark-tile-locked {\n  margin-top: var(--space-4);\n  padding: var(--space-5);\n  border: 1px dashed var(--slate-300);\n  border-radius: var(--radius-md);\n  background: var(--bg-soft);\n  font-size: 13px;\n  color: var(--slate-600);\n  display: flex;\n  align-items: center;\n  gap: var(--space-3);\n}\n\n/* ─── Input state showcase ────────────────────────────────── */\n.input-states {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: var(--space-5);\n}\n.input-state-label {\n  display: block;\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--slate-500);\n  margin-bottom: 8px;\n}\n\n/* ─── Button state showcase ───────────────────────────────── */\n.button-state-grid {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: var(--space-5);\n}\n.button-state-cell {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 10px;\n  padding: var(--space-5);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-md);\n  background: var(--bg-paper);\n}\n.button-state-cell .state-label {\n  font-size: 11px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: 0.1em;\n  color: var(--slate-500);\n}\n\n@media (max-width: 1100px) {\n  .mark-explore { grid-template-columns: repeat(3, 1fr); }\n  .input-states { grid-template-columns: 1fr; }\n  .button-state-grid { grid-template-columns: repeat(2, 1fr); }\n}\n@media (max-width: 700px) {\n  .mark-explore { grid-template-columns: repeat(2, 1fr); }\n  .button-state-grid { grid-template-columns: 1fr; }\n  .campaign-list li { grid-template-columns: 14px 1fr; }\n  .campaign-list li .campaign-meta { grid-column: 2; }\n}\n\n/* ─── Logo strip ──────────────────────────────────────────── */\n.logo-strip {\n  display: flex; align-items: center; justify-content: space-between;\n  flex-wrap: wrap; gap: var(--space-7);\n  padding: var(--space-7) var(--space-6);\n  margin-top: var(--space-11);\n  background: var(--bg-paper);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-xl);\n}\n.logo-strip .label {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-caps);\n  color: var(--slate-500);\n}\n.fake-logo {\n  font-family: var(--font-display);\n  font-size: var(--text-lg);\n  font-weight: 700;\n  color: var(--slate-400);\n  letter-spacing: -0.01em;\n  transition: color var(--dur-fast) var(--ease-out);\n}\n.fake-logo:hover { color: var(--slate-700); }\n\n/* ─── Steps ───────────────────────────────────────────────── */\n.steps {\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: var(--space-5);\n}\n.step {\n  border: 1px solid var(--border);\n  border-radius: var(--radius-xl);\n  padding: var(--space-7);\n  background: var(--bg-paper);\n  display: flex; flex-direction: column; gap: var(--space-5);\n  transition: border-color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);\n}\n.step:hover { border-color: var(--slate-300); background: var(--bg-soft); }\n.step-num {\n  font-family: var(--font-sans);\n  font-size: var(--text-xs);\n  font-weight: 500;\n  color: var(--moz-blue-600);\n  letter-spacing: var(--tracking-caps);\n  text-transform: uppercase;\n}\n.step h3 {\n  font-family: var(--font-display);\n  font-size: var(--text-xl);\n  font-weight: 700;\n  letter-spacing: -0.005em;\n  margin: 0;\n  color: var(--ink);\n}\n.step p {\n  font-size: var(--text-sm);\n  color: var(--slate-600);\n  margin: 0;\n  line-height: 1.55;\n}\n.step-visual {\n  aspect-ratio: 4 / 3;\n  background: var(--moz-blue-50);\n  border-radius: var(--radius-md);\n  border: 1px solid var(--moz-blue-100);\n  display: flex; align-items: center; justify-content: center;\n  color: var(--moz-blue-700);\n}\n\n/* ─── CTA ─────────────────────────────────────────────────── */\n.cta {\n  background: var(--ink);\n  color: white;\n  border-radius: var(--radius-2xl);\n  padding: var(--space-12) var(--space-10);\n  text-align: center;\n  position: relative;\n  overflow: hidden;\n}\n.cta::before {\n  content: \"\";\n  position: absolute;\n  inset: -50% -10% auto auto;\n  width: 70%; aspect-ratio: 1;\n  background: radial-gradient(circle, rgba(37, 99, 235, 0.45), transparent 60%);\n  pointer-events: none;\n}\n.cta h2 {\n  font-family: var(--font-display);\n  font-size: var(--text-5xl);\n  font-weight: 400;\n  letter-spacing: -0.025em;\n  line-height: 1.04;\n  margin: 0 0 var(--space-4);\n  color: white;\n  text-wrap: balance;\n  position: relative;\n}\n.cta h2 em { font-style: italic; color: var(--moz-blue-400); }\n.cta p {\n  font-size: var(--text-lg);\n  color: var(--slate-300);\n  margin: 0 auto var(--space-7);\n  max-width: 56ch;\n  line-height: 1.55;\n  position: relative;\n}\n.cta-actions {\n  display: flex;\n  justify-content: center;\n  gap: var(--space-3);\n  position: relative;\n  flex-wrap: wrap;\n}\n.cta .btn {\n  --btn-bg: white;\n  --btn-fg: var(--ink);\n  --btn-bg-hover: var(--slate-100);\n  --btn-border: white;\n  --btn-border-hover: var(--slate-100);\n}\n.cta .btn--ghost {\n  --btn-bg: transparent;\n  --btn-fg: white;\n  --btn-bg-hover: rgba(255,255,255,0.08);\n  --btn-border: rgba(255,255,255,0.22);\n  --btn-border-hover: rgba(255,255,255,0.35);\n}\n\n/* ─── Responsive ──────────────────────────────────────────── */\n@media (max-width: 1100px) {\n  .hero-grid { grid-template-columns: 1fr; }\n  .hero-art { max-width: 480px; margin: 0 auto; }\n  .applied-hero { grid-template-columns: 1fr; }\n  .steps { grid-template-columns: 1fr 1fr; }\n  .logo-gallery { grid-template-columns: 1fr 1fr; }\n  .icon-grid { grid-template-columns: repeat(6, 1fr); }\n  .toc { grid-template-columns: 1fr 1fr; }\n  .toc a:nth-child(3) { border-top: 1px solid var(--border); border-left: 0; }\n  .toc a:nth-child(4) { border-top: 1px solid var(--border); }\n}\n@media (max-width: 700px) {\n  .hero-h1 { font-size: var(--text-5xl); }\n  .form-grid { grid-template-columns: 1fr; }\n  .icon-grid { grid-template-columns: repeat(4, 1fr); }\n  .steps { grid-template-columns: 1fr; }\n  .logo-gallery { grid-template-columns: 1fr; }\n  .type-row { grid-template-columns: 1fr; gap: var(--space-2); }\n  .type-row .specs { text-align: left; }\n  .toc { grid-template-columns: 1fr; }\n  .toc a { border-left: 0 !important; border-top: 1px solid var(--border); }\n  .toc a:first-child { border-top: 0; }\n  .applied-hero, .cta { padding: var(--space-9) var(--space-6); }\n}\n<\u002Fstyle>\n\n\n<\u002Fhead>\n<body>\n\n<!-- ═══ Reusable Moz mark (SVG sprite) ═══ -->\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <defs>\n    <!-- Moz mark: broadcast — source dot + 3 concentric arcs radiating outward -->\n    <symbol id=\"moz-mark\" viewBox=\"0 0 40 32\">\n      <!-- Moz mark: a bold filled half-disc (the source) projecting two echo dots.\n           Big block of weight on the left, decaying signal to the right. -->\n      <path d=\"M 6 4 A 12 12 0 0 1 6 28 Z\" fill=\"currentColor\"><\u002Fpath>\n      <circle cx=\"26\" cy=\"16\" r=\"3\" fill=\"currentColor\"><\u002Fcircle>\n      <circle cx=\"35.5\" cy=\"16\" r=\"1.5\" fill=\"currentColor\"><\u002Fcircle>\n    <\u002Fsymbol>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n<!-- ═══ NAV ═══ -->\n<header class=\"nav\">\n  <div class=\"page nav-inner\">\n    <a href=\"#top\" class=\"logo-lockup\" aria-label=\"Moz home\">\n      <span class=\"logo-mark\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n      <span class=\"wordmark\">Moz<\u002Fspan>\n    <\u002Fa>\n    <nav class=\"nav-links\" aria-label=\"Primary\">\n      <a href=\"#foundations\">Foundations<\u002Fa>\n      <a href=\"#brand\">Brand<\u002Fa>\n      <a href=\"#components\">Components<\u002Fa>\n      <a href=\"#patterns\">Patterns<\u002Fa>\n    <\u002Fnav>\n    <div class=\"nav-cta\">\n      <a class=\"btn btn--ghost btn--sm\" href=\"#\">Sign in<\u002Fa>\n      <a class=\"btn btn--sm\" href=\"#\">Get started<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══ HERO ═══ -->\n<section class=\"hero\" id=\"top\">\n  <div class=\"page\">\n    <div class=\"hero-grid\">\n      <div>\n        <span class=\"badge badge--blue\" style=\"margin-bottom: var(--space-5);\">\n          <span class=\"dot dot--blue\"><\u002Fspan> Design system · v1.0\n        <\u002Fspan>\n        <h1 class=\"hero-h1\">The system behind <em>Moz<\u002Fem>.<\u002Fh1>\n        <p class=\"hero-lede\">Moz is the AI agent that markets your business — studying the market, understanding your customer, and shipping content while you sleep. This is the visual language behind it: warm, confident, and human.<\u002Fp>\n        <div class=\"hero-actions\">\n          <a class=\"btn btn--lg\" href=\"#components\">Browse components<\u002Fa>\n          <a class=\"btn btn--ghost btn--lg\" href=\"#brand\">Brand guidelines<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"hero-meta\">\n          <div><strong>Libre Baskerville<\u002Fstrong> display<\u002Fdiv>\n          <div><strong>DM Sans<\u002Fstrong> body<\u002Fdiv>\n          <div><strong>Royal blue<\u002Fstrong> accent<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-art\" aria-hidden=\"true\">\n        <span class=\"hero-mark-xl\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <span class=\"hero-tick\" data-label=\"01\">Studies<\u002Fspan>\n        <span class=\"hero-tick\" data-label=\"02\">Understands<\u002Fspan>\n        <span class=\"hero-tick\" data-label=\"03\">Ships<\u002Fspan>\n        <span class=\"hero-tick\" data-label=\"04\">Iterates<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav class=\"toc\" aria-label=\"Table of contents\">\n      <a href=\"#foundations\"><span class=\"toc-num\">01 / Foundations<\u002Fspan><span class=\"toc-title\">Color, type, space, motion<\u002Fspan><\u002Fa>\n      <a href=\"#brand\"><span class=\"toc-num\">02 / Brand<\u002Fspan><span class=\"toc-title\">Logo, mark, lockups<\u002Fspan><\u002Fa>\n      <a href=\"#components\"><span class=\"toc-num\">03 / Components<\u002Fspan><span class=\"toc-title\">Buttons, inputs, choices, cards<\u002Fspan><\u002Fa>\n      <a href=\"#patterns\"><span class=\"toc-num\">04 / Patterns<\u002Fspan><span class=\"toc-title\">Sample sections<\u002Fspan><\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════════════\n     01 — FOUNDATIONS\n     ═══════════════════════════════════════════════════════════ -->\n<section class=\"section\" id=\"foundations\">\n  <div class=\"page\">\n\n    <div class=\"section-head\">\n      <div>\n        <span class=\"section-eyebrow\">01 / Foundations<\u002Fspan>\n        <h2 class=\"section-title\">The raw materials.<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"section-subtitle\">Every visible decision in Moz reduces to one of these tokens. Use them everywhere; never invent a new value inline.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- COLOR -->\n    <div class=\"sub-block\">\n      <div class=\"sub-head\">\n        <h3 class=\"sub-title\">Color<\u002Fh3>\n        <p class=\"sub-desc\">Black anchors the system; blue carries the brand. Everything else is a neutral or a semantic state.<\u002Fp>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\">Brand · Royal blue<\u002Fh4>\n      <div class=\"swatch-grid\">\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--moz-blue-50)\">#EFF4FF<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 50<\u002Fspan><span class=\"swatch-token\">--moz-blue-50<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--moz-blue-100)\">#DBE6FE<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 100<\u002Fspan><span class=\"swatch-token\">--moz-blue-100<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--moz-blue-300)\">#93B4FD<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 300<\u002Fspan><span class=\"swatch-token\">--moz-blue-300<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--moz-blue-500)\">#3B6AF6<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 500<\u002Fspan><span class=\"swatch-token\">--moz-blue-500<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--moz-blue-600)\">#2563EB ·  Primary<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 600<\u002Fspan><span class=\"swatch-token\">--moz-blue-600<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--moz-blue-700)\">#1D4FD8<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 700<\u002Fspan><span class=\"swatch-token\">--moz-blue-700<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--moz-blue-900)\">#1E3A8A<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 900<\u002Fspan><span class=\"swatch-token\">--moz-blue-900<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--moz-blue-950)\">#172554<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Blue 950<\u002Fspan><span class=\"swatch-token\">--moz-blue-950<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\" style=\"margin-top:var(--space-8)\">Ink &amp; neutrals<\u002Fh4>\n      <div class=\"swatch-grid\">\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--ink)\">#0B0D12 ·  Ink<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Ink<\u002Fspan><span class=\"swatch-token\">--ink<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--slate-800)\">#1F232C<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Slate 800<\u002Fspan><span class=\"swatch-token\">--slate-800<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--slate-600)\">#4B5260<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Slate 600<\u002Fspan><span class=\"swatch-token\">--slate-600<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--slate-400)\">#99A1B3<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Slate 400<\u002Fspan><span class=\"swatch-token\">--slate-400<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--slate-200)\">#E3E6EE<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Slate 200<\u002Fspan><span class=\"swatch-token\">--slate-200<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--slate-100)\">#F0F2F6<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Slate 100<\u002Fspan><span class=\"swatch-token\">--slate-100<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--bg-soft)\">#F8FAFC<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Bg soft<\u002Fspan><span class=\"swatch-token\">--bg-soft<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--bg);border-bottom:1px solid var(--border)\">#FFFFFF<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Background<\u002Fspan><span class=\"swatch-token\">--bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\" style=\"margin-top:var(--space-8)\">Semantic<\u002Fh4>\n      <div class=\"swatch-grid\">\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--success)\">#10B981<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Success<\u002Fspan><span class=\"swatch-token\">--success<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--success-bg)\">#E7F8F1<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Success bg<\u002Fspan><span class=\"swatch-token\">--success-bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--warning)\">#F59E0B<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Warning<\u002Fspan><span class=\"swatch-token\">--warning<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--warning-bg)\">#FEF4DE<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Warning bg<\u002Fspan><span class=\"swatch-token\">--warning-bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-dark\" style=\"background:var(--danger)\">#EF4444<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Danger<\u002Fspan><span class=\"swatch-token\">--danger<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"swatch\"><div class=\"swatch-color is-light\" style=\"background:var(--danger-bg)\">#FEECEC<\u002Fdiv><div class=\"swatch-meta\"><span class=\"swatch-name\">Danger bg<\u002Fspan><span class=\"swatch-token\">--danger-bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TYPE -->\n    <div class=\"sub-block\">\n      <div class=\"sub-head\">\n        <h3 class=\"sub-title\">Typography<\u002Fh3>\n        <p class=\"sub-desc\"><strong>Libre Baskerville<\u002Fstrong> handles every heading — generous, editorial, with italics for emphasis. <strong>DM Sans<\u002Fstrong> handles everything else: body copy, UI labels, overlines, even token names. Two fonts, no more.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"type-stack\">\n        <div class=\"type-row\">\n          <span class=\"label\">Display<\u002Fspan>\n          <span class=\"display\" style=\"font-size:var(--text-7xl)\">The quiet hum of growth.<\u002Fspan>\n          <span class=\"specs\">92 / 1.0 · −0.045em<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">H1<\u002Fspan>\n          <span class=\"display\" style=\"font-size:var(--text-5xl)\">Marketing that listens first.<\u002Fspan>\n          <span class=\"specs\">56 / 1.08 · −0.02em<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">H2<\u002Fspan>\n          <span class=\"display\" style=\"font-size:var(--text-4xl)\">Studies your market.<\u002Fspan>\n          <span class=\"specs\">44 / 1.1 · −0.018em<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">H3<\u002Fspan>\n          <span class=\"display\" style=\"font-size:var(--text-2xl);font-weight:700\">Understands the customer<\u002Fspan>\n          <span class=\"specs\">26 / 1.2 · 700<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">Lede<\u002Fspan>\n          <span class=\"body-sample\" style=\"font-size:var(--text-xl);color:var(--slate-700)\">Moz reads your codebase, support tickets, and product launches — and turns them into campaigns that ship themselves.<\u002Fspan>\n          <span class=\"specs\">21 / 1.45 · DM Sans 400<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">Body<\u002Fspan>\n          <span class=\"body-sample\">Standard body copy is set in DM Sans at 16 pixels with a 1.55 leading. It reads quietly underneath the serif and supports long-form sections without fatigue. Use it for paragraphs, descriptions, and most UI labels.<\u002Fspan>\n          <span class=\"specs\">16 / 1.55 · DM Sans 400<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"type-row\">\n          <span class=\"label\">Small<\u002Fspan>\n          <span class=\"body-sample\" style=\"font-size:var(--text-sm);color:var(--slate-600)\">Captions, meta, and dense UI rows live at the small size.<\u002Fspan>\n          <span class=\"specs\">13 / 1.55 · DM Sans 400<\u002Fspan>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SPACING / RADIUS / SHADOWS -->\n    <div class=\"sub-block\">\n      <div class=\"sub-head\">\n        <h3 class=\"sub-title\">Space, shape &amp; depth<\u002Fh3>\n        <p class=\"sub-desc\">A 4-pixel grid governs all spacing. Radii are rounded but never balloon. Shadows are quiet — soft greys, never blue glows except for buttons.<\u002Fp>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\">Spacing scale<\u002Fh4>\n      <div class=\"spacing-list\">\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-1<\u002Fspan><span class=\"spacing-px\">4<\u002Fspan><span class=\"space-demo\" style=\"width:4px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-2<\u002Fspan><span class=\"spacing-px\">8<\u002Fspan><span class=\"space-demo\" style=\"width:8px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-3<\u002Fspan><span class=\"spacing-px\">12<\u002Fspan><span class=\"space-demo\" style=\"width:12px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-4<\u002Fspan><span class=\"spacing-px\">16<\u002Fspan><span class=\"space-demo\" style=\"width:16px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-5<\u002Fspan><span class=\"spacing-px\">20<\u002Fspan><span class=\"space-demo\" style=\"width:20px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-6<\u002Fspan><span class=\"spacing-px\">24<\u002Fspan><span class=\"space-demo\" style=\"width:24px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-7<\u002Fspan><span class=\"spacing-px\">32<\u002Fspan><span class=\"space-demo\" style=\"width:32px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-8<\u002Fspan><span class=\"spacing-px\">40<\u002Fspan><span class=\"space-demo\" style=\"width:40px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-9<\u002Fspan><span class=\"spacing-px\">48<\u002Fspan><span class=\"space-demo\" style=\"width:48px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-10<\u002Fspan><span class=\"spacing-px\">64<\u002Fspan><span class=\"space-demo\" style=\"width:64px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-11<\u002Fspan><span class=\"spacing-px\">80<\u002Fspan><span class=\"space-demo\" style=\"width:80px\"><\u002Fspan><\u002Fdiv>\n        <div class=\"spacing-row\"><span class=\"spacing-token\">--space-12<\u002Fspan><span class=\"spacing-px\">96<\u002Fspan><span class=\"space-demo\" style=\"width:96px\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\" style=\"margin-top:var(--space-9)\">Radii<\u002Fh4>\n      <div class=\"spec-grid\">\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-xs)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">XS · 4px<\u002Fspan><span class=\"token\">--radius-xs<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-sm)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">SM · 6px<\u002Fspan><span class=\"token\">--radius-sm<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-md)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">MD · 10px<\u002Fspan><span class=\"token\">--radius-md<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-lg)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">LG · 14px<\u002Fspan><span class=\"token\">--radius-lg<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-xl)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">XL · 20px<\u002Fspan><span class=\"token\">--radius-xl<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"radius-box\" style=\"border-radius:var(--radius-2xl)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">2XL · 28px<\u002Fspan><span class=\"token\">--radius-2xl<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <h4 class=\"mini-label\" style=\"margin-top:var(--space-9)\">Shadows<\u002Fh4>\n      <div class=\"spec-grid\">\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-xs)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">XS<\u002Fspan><span class=\"token\">--shadow-xs<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-sm)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">SM<\u002Fspan><span class=\"token\">--shadow-sm<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-md)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">MD<\u002Fspan><span class=\"token\">--shadow-md<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-lg)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">LG<\u002Fspan><span class=\"token\">--shadow-lg<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-xl)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">XL<\u002Fspan><span class=\"token\">--shadow-xl<\u002Fspan><\u002Fdiv>\n        <div class=\"spec-card\"><div class=\"demo\"><div class=\"shadow-box\" style=\"box-shadow:var(--shadow-blue)\"><\u002Fdiv><\u002Fdiv><span class=\"label\">Blue glow<\u002Fspan><span class=\"token\">--shadow-blue<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════════════\n     02 — BRAND\n     ═══════════════════════════════════════════════════════════ -->\n<section class=\"section\" id=\"brand\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div>\n        <span class=\"section-eyebrow\">02 / Brand<\u002Fspan>\n        <h2 class=\"section-title\">The mark, the wordmark, the lockup.<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"section-subtitle\">A bold filled source projects two echo dots — the signal weakens as it travels. It says what Moz does without spelling it out: amplify the message, reach further, fade gracefully.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- ─── Mark exploration (review & choose) ─── -->\n    <div class=\"sub-block\">\n      <div class=\"sub-head\">\n        <h3 class=\"sub-title\">Mark exploration <span style=\"color:var(--slate-500);font-weight:400\">— megaphone &amp; stamp variants<\u002Fspan><\u002Fh3>\n        <p class=\"sub-desc\">Four megaphone takes (A1–A4) and four stamp takes (B1–B4). Each variant turns one knob: cone angle, output gesture, aperture shape, weight. Pick the row, then the variant.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"mini-label\" style=\"margin-top:var(--space-6)\">Row A · Megaphone family<\u002Fdiv>\n      <div class=\"mark-explore\">\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 44 32\">\n              <!-- A1 · Classic horn: handle pill + tapered cone + rim, single output dot -->\n              <path d=\"M 3 13 H 7 V 19 H 3 A 1.5 1.5 0 0 1 1.5 17.5 V 14.5 A 1.5 1.5 0 0 1 3 13 Z\" fill=\"currentColor\"><\u002Fpath>\n              <path d=\"M 9 11 L 26 4 A 1.5 1.5 0 0 1 28.5 5.4 V 26.6 A 1.5 1.5 0 0 1 26 28 L 9 21 Z\" fill=\"currentColor\"><\u002Fpath>\n              <rect x=\"28.5\" y=\"3\" width=\"3\" height=\"26\" rx=\"1\" fill=\"currentColor\"><\u002Frect>\n              <circle cx=\"37\" cy=\"16\" r=\"2\" fill=\"currentColor\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Classic horn<\u002Fspan>\n            <span class=\"mark-tile-letter\">A1<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 42 32\">\n              <!-- A2 · Wide flare: smaller mouthpiece, dramatic flare opening, no echo dot -->\n              <path d=\"M 2 14 H 8 V 18 H 2 A 1.5 1.5 0 0 1 0.5 16.5 V 15.5 A 1.5 1.5 0 0 1 2 14 Z\" fill=\"currentColor\"><\u002Fpath>\n              <path d=\"M 9 14 L 30 2 A 2 2 0 0 1 33 3.7 V 28.3 A 2 2 0 0 1 30 30 L 9 18 Z\" fill=\"currentColor\"><\u002Fpath>\n              <g fill=\"currentColor\">\n                <rect x=\"36\" y=\"15.2\" width=\"5\" height=\"1.6\" rx=\"0.8\"><\u002Frect>\n                <rect x=\"35\" y=\"9\" width=\"4\" height=\"1.6\" rx=\"0.8\" transform=\"rotate(-35 37 9.8)\"><\u002Frect>\n                <rect x=\"35\" y=\"22\" width=\"4\" height=\"1.6\" rx=\"0.8\" transform=\"rotate(35 37 22.8)\"><\u002Frect>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Wide flare<\u002Fspan>\n            <span class=\"mark-tile-letter\">A2<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 44 32\">\n              <!-- A3 · Tilted horn: angled up-right, like it's actively projecting -->\n              <g transform=\"rotate(-15 16 16)\">\n                <path d=\"M 3 14 H 7 V 18 H 3 A 1.5 1.5 0 0 1 1.5 16.5 V 15.5 A 1.5 1.5 0 0 1 3 14 Z\" fill=\"currentColor\"><\u002Fpath>\n                <path d=\"M 9 12 L 27 4 A 1.5 1.5 0 0 1 29.5 5.4 V 26.6 A 1.5 1.5 0 0 1 27 28 L 9 20 Z\" fill=\"currentColor\"><\u002Fpath>\n                <rect x=\"29.5\" y=\"3\" width=\"3\" height=\"26\" rx=\"1\" fill=\"currentColor\"><\u002Frect>\n              <\u002Fg>\n              <circle cx=\"40\" cy=\"6\" r=\"1.8\" fill=\"currentColor\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Tilted horn<\u002Fspan>\n            <span class=\"mark-tile-letter\">A3<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 44 32\">\n              <!-- A4 · Two-tone: handle + cone, with output sound rendered as 3 chevrons (>>>) -->\n              <path d=\"M 3 13 H 7 V 19 H 3 A 1.5 1.5 0 0 1 1.5 17.5 V 14.5 A 1.5 1.5 0 0 1 3 13 Z\" fill=\"currentColor\"><\u002Fpath>\n              <path d=\"M 9 11 L 26 4 A 1.5 1.5 0 0 1 28.5 5.4 V 26.6 A 1.5 1.5 0 0 1 26 28 L 9 21 Z\" fill=\"currentColor\"><\u002Fpath>\n              <rect x=\"28.5\" y=\"3\" width=\"3\" height=\"26\" rx=\"1\" fill=\"currentColor\"><\u002Frect>\n              <path d=\"M 34 10 L 38 16 L 34 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <path d=\"M 38.5 13 L 41 16 L 38.5 19\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.55\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Horn + chevrons<\u002Fspan>\n            <span class=\"mark-tile-letter\">A4<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\" style=\"opacity:0.4;background:var(--bg-soft);cursor:default\" aria-hidden=\"true\">\n          <div class=\"mark-tile-art\"><\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\" style=\"color:var(--slate-400)\">—<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"mini-label\" style=\"margin-top:var(--space-8)\">Row B · Stamp family<\u002Fdiv>\n      <div class=\"mark-explore\">\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 36 32\">\n              <!-- B1 · Rounded square + circular aperture (original) -->\n              <path d=\"M 6 4 H 20 A 4 4 0 0 1 24 8 V 24 A 4 4 0 0 1 20 28 H 6 A 4 4 0 0 1 2 24 V 8 A 4 4 0 0 1 6 4 Z M 13 16 m -3.5 0 a 3.5 3.5 0 1 0 7 0 a 3.5 3.5 0 1 0 -7 0\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n              <circle cx=\"30\" cy=\"16\" r=\"2.5\" fill=\"currentColor\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Round aperture<\u002Fspan>\n            <span class=\"mark-tile-letter\">B1<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 38 32\">\n              <!-- B2 · Stamp + chevron aperture (>) -->\n              <path d=\"M 6 4 H 20 A 4 4 0 0 1 24 8 V 24 A 4 4 0 0 1 20 28 H 6 A 4 4 0 0 1 2 24 V 8 A 4 4 0 0 1 6 4 Z\" fill=\"currentColor\"><\u002Fpath>\n              <path d=\"M 9 11 L 17 16 L 9 21\" fill=\"none\" stroke=\"var(--bg)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n              <circle cx=\"30\" cy=\"13\" r=\"2.2\" fill=\"currentColor\"><\u002Fcircle>\n              <circle cx=\"33\" cy=\"19\" r=\"1.4\" fill=\"currentColor\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Chevron stamp<\u002Fspan>\n            <span class=\"mark-tile-letter\">B2<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 38 32\">\n              <!-- B3 · Stamp with bold lowercase 'm' counter-formed -->\n              <path d=\"M 6 4 H 20 A 4 4 0 0 1 24 8 V 24 A 4 4 0 0 1 20 28 H 6 A 4 4 0 0 1 2 24 V 8 A 4 4 0 0 1 6 4 Z M 6 22 V 14 A 3 3 0 0 1 11 14 V 22 M 11 14 A 3 3 0 0 1 16 14 V 22\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n              <circle cx=\"30\" cy=\"16\" r=\"2.5\" fill=\"currentColor\"><\u002Fcircle>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">m-stamp<\u002Fspan>\n            <span class=\"mark-tile-letter\">B3<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\">\n          <div class=\"mark-tile-art\">\n            <svg viewBox=\"0 0 38 32\">\n              <!-- B4 · Stamp + slot aperture (horizontal mouth) -->\n              <path d=\"M 6 4 H 20 A 4 4 0 0 1 24 8 V 24 A 4 4 0 0 1 20 28 H 6 A 4 4 0 0 1 2 24 V 8 A 4 4 0 0 1 6 4 Z M 7 14 H 19 A 2 2 0 0 1 19 18 H 7 A 2 2 0 0 1 7 14 Z\" fill=\"currentColor\" fill-rule=\"evenodd\"><\u002Fpath>\n              <rect x=\"28\" y=\"14.5\" width=\"7\" height=\"3\" rx=\"1.5\" fill=\"currentColor\"><\u002Frect>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\">Slot stamp<\u002Fspan>\n            <span class=\"mark-tile-letter\">B4<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"mark-tile\" style=\"opacity:0.4;background:var(--bg-soft);cursor:default\" aria-hidden=\"true\">\n          <div class=\"mark-tile-art\"><\u002Fdiv>\n          <div class=\"mark-tile-foot\">\n            <span class=\"mark-tile-name\" style=\"color:var(--slate-400)\">—<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p class=\"frame-caption\" style=\"margin-top:var(--space-5)\">↑ Reply with a code (A2, B3, etc.) and I'll lock it across the system.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- Lockup gallery -->\n    <div class=\"logo-gallery\">\n      <div class=\"logo-tile\">\n        <span class=\"logo-mark logo-mark--xl\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <span class=\"logo-tile-label\">Mark · Ink<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"logo-tile\">\n        <span class=\"logo-mark logo-mark--xl\" style=\"color:var(--moz-blue-600)\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <span class=\"logo-tile-label\">Mark · Blue<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"logo-tile is-dark\">\n        <span class=\"logo-mark logo-mark--xl\" style=\"color:white\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <span class=\"logo-tile-label\">Mark · Inverted<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"logo-tile is-blue\">\n        <span class=\"logo-mark logo-mark--xl\" style=\"color:white\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n        <span class=\"logo-tile-label\">Mark · On blue<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Wordmark + lockups -->\n    <div class=\"grid-2\" style=\"margin-top:var(--space-7)\">\n      <div class=\"demo-frame\" data-label=\"Wordmark\">\n        <span class=\"wordmark\" style=\"font-size:80px\">Moz<\u002Fspan>\n        <p class=\"frame-caption\">DM Sans 600 · lowercase · −0.04em tracking<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"demo-frame\" data-label=\"Horizontal lockup\">\n        <div class=\"logo-lockup logo-lockup--lg\">\n          <span class=\"logo-mark logo-mark--lg\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n          <span class=\"wordmark wordmark--lg\">Moz<\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"frame-caption\">Mark + wordmark, baseline-aligned<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Construction grid -->\n    <div class=\"demo-frame\" data-label=\"Construction\" style=\"margin-top:var(--space-7)\">\n      <div class=\"construction\">\n        <div class=\"construction-grid\">\n          <span class=\"logo-mark\" style=\"width:250px;height:200px\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n          <span class=\"cg-line cg-h\" style=\"top:0\"><\u002Fspan>\n          <span class=\"cg-line cg-h\" style=\"top:50%\"><\u002Fspan>\n          <span class=\"cg-line cg-h\" style=\"bottom:0\"><\u002Fspan>\n          <span class=\"cg-line cg-v\" style=\"left:0\"><\u002Fspan>\n          <span class=\"cg-line cg-v\" style=\"left:25%\"><\u002Fspan>\n          <span class=\"cg-line cg-v\" style=\"left:50%\"><\u002Fspan>\n          <span class=\"cg-line cg-v\" style=\"left:75%\"><\u002Fspan>\n          <span class=\"cg-line cg-v\" style=\"right:0\"><\u002Fspan>\n        <\u002Fdiv>\n        <p class=\"frame-caption\">Built on a 40×32 grid. The source half-disc has a 12-unit radius; echo dots step down by half.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Do / Don't -->\n    <div class=\"grid-2\" style=\"margin-top:var(--space-7)\">\n      <div class=\"do-tile\">\n        <span class=\"do-badge do-yes\">Do<\u002Fspan>\n        <div class=\"do-art\">\n          <div class=\"logo-lockup logo-lockup--lg\">\n            <span class=\"logo-mark logo-mark--lg\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n            <span class=\"wordmark wordmark--lg\">Moz<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"do-caption\">Keep the mark in ink, blue, or inverted white. Maintain at least 0.5× mark-height clearspace.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"do-tile\">\n        <span class=\"do-badge do-no\">Don't<\u002Fspan>\n        <div class=\"do-art\">\n          <div class=\"logo-lockup logo-lockup--lg\" style=\"transform:skew(-8deg);opacity:0.7\">\n            <span class=\"logo-mark logo-mark--lg\" style=\"color:#10B981\"><svg viewBox=\"0 0 40 32\"><use href=\"#moz-mark\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n            <span class=\"wordmark wordmark--lg\" style=\"font-family:var(--font-sans);color:#10B981\">Moz<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"do-caption\">Don't re-color, skew, or substitute the wordmark typeface. The serif is non-negotiable.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════════════════════════════════════════\n     03 — COMPONENTS\n     ═══════════════════════════════════════════════════════════ -->\n<section class=\"section\" id=\"components\">\n  <div class=\"page\">\n\n    <div class=\"section-head\">\n      <div>\n        <span class=\"section-eyebrow\">03 / Components<\u002Fspan>\n        <h2 class=\"section-title\">A small kit, used heavily.<\u002Fh2>\n      <\u002Fdiv>\n      <p class=\"section-subtitle\">Ten components cover ninety percent of Moz. Every screen is built from the same parts.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- BUTTONS -->\n    <div class=\"sub-block\">\n      <h3 class=\"sub-title\">Buttons<\u002Fh3>\n      <p class=\"sub-desc\">Buttons are pill-shaped, bold, and flat. Primary stays black; hover darkens with a subtle top-edge sheen — no shadow, no color flip, just the kind of surface response you'd expect from Linear or Vercel.<\u002Fp>\n\n      <div class=\"demo-frame\" data-label=\"Variants &amp; sizes\">\n        <div class=\"row\" style=\"margin-bottom: var(--space-5)\">\n          <button class=\"btn\">Get started<\u002Fbutton>\n          <button class=\"btn btn--blue\">Get started<\u002Fbutton>\n          <button class=\"btn btn--ghost\">Book a demo<\u002Fbutton>\n          <a class=\"btn btn--link\" href=\"#\">Read the docs →<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"row\">\n          <button class=\"btn btn--sm\">Small<\u002Fbutton>\n          <button class=\"btn\">Default<\u002Fbutton>\n          <button class=\"btn btn--lg\">Large<\u002Fbutton>\n          <button class=\"btn btn--xl\">Extra large<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"demo-frame\" data-label=\"States\" style=\"margin-top:var(--space-5)\">\n        <div class=\"button-state-grid\">\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Default<\u002Fspan>\n            <button class=\"btn\">Launch campaign<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Hover<\u002Fspan>\n            <button class=\"btn\" style=\"box-shadow: 0 0 0 4px rgba(11, 13, 18, 0.12); transform: scale(1.015)\">Launch campaign<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Focused<\u002Fspan>\n            <button class=\"btn\" style=\"box-shadow: 0 0 0 4px rgba(11, 13, 18, 0.20)\">Launch campaign<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Loading<\u002Fspan>\n            <button class=\"btn\" aria-busy=\"true\">\n              <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" style=\"animation: spin 0.8s linear infinite\"><path d=\"M21 12a9 9 0 11-6.219-8.56\"><\u002Fpath><\u002Fsvg>\n              Launching…\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">With icon<\u002Fspan>\n            <button class=\"btn\">\n              Continue\n              <svg class=\"btn-icon-arrow\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 5l7 7-7 7\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Icon-only<\u002Fspan>\n            <button class=\"btn btn--ghost\" aria-label=\"Search\" style=\"width:44px;padding:0\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Destructive<\u002Fspan>\n            <button class=\"btn\" style=\"--btn-bg:var(--danger);--btn-border:var(--danger);--btn-bg-hover:#C8242B;--btn-border-hover:#C8242B\">Delete campaign<\u002Fbutton>\n          <\u002Fdiv>\n          <div class=\"button-state-cell\">\n            <span class=\"state-label\">Disabled<\u002Fspan>\n            <button class=\"btn\" disabled=\"\" style=\"opacity:0.4;cursor:not-allowed\">Launch campaign<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <style>@keyframes spin { to { transform: rotate(360deg); } }<\u002Fstyle>\n    <\u002Fdiv>\n\n    <!-- INPUTS -->\n    <div class=\"sub-block\">\n      <h3 class=\"sub-title\">Inputs &amp; chips<\u002Fh3>\n      <p class=\"sub-desc\">Fields rest at a soft border. Hover deepens it; focus locks to ink-black with a soft ring. Every state is explicit — no guessing where the cursor lives.<\u002Fp>\n\n      <div class=\"demo-frame\" data-label=\"State showcase\">\n        <div class=\"input-states\">\n          <div>\n            <span class=\"input-state-label\">Default<\u002Fspan>\n            <input class=\"input\" type=\"text\" placeholder=\"acme.com\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Hover<\u002Fspan>\n            <input class=\"input\" type=\"text\" placeholder=\"acme.com\" style=\"border-color:var(--slate-400)\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Focused<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"acme.com\" style=\"border-color:var(--ink);box-shadow: 0 0 0 4px rgba(11, 13, 18, 0.07)\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Filled<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"Acme Inc.\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Success<\u002Fspan>\n            <input class=\"input is-success\" type=\"text\" value=\"ada@acme.com\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Error<\u002Fspan>\n            <input class=\"input is-error\" type=\"text\" value=\"ada@\">\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">With prefix<\u002Fspan>\n            <div class=\"input-group\">\n              <span class=\"input-prefix\">https://<\u002Fspan>\n              <input class=\"input\" type=\"text\" placeholder=\"acme.com\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <span class=\"input-state-label\">Disabled<\u002Fspan>\n            <input class=\"input\" type=\"text\" value=\"Locked value\" disabled=\"\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"demo-frame\" data-label=\"Fields in context\" style=\"margin-top:var(--space-5)\">\n        <div class=\"form-grid\">\n          <div>\n            <label class=\"field-label\">Company name<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Acme, Inc.\">\n            <p class=\"field-hint\">We'll use this on your landing pages.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <label class=\"field-label\">Website<\u002Flabel>\n            <div class=\"input--with-icon\">\n              <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>\n              <input class=\"input\" type=\"url\" placeholder=\"acme.com\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <label class=\"field-label\">What does Moz market for you?<\u002Flabel>\n            <textarea class=\"textarea\" placeholder=\"We sell a B2B accounting tool to small CFOs. Our voice is dry-witty, our customers are skeptical, and we close on demos…\"><\u002Ftextarea>\n            <p class=\"field-hint\">A paragraph is plenty — Moz learns the rest from your site.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"demo-frame\" data-label=\"Chips\" style=\"margin-top:var(--space-5)\">\n        <div class=\"row\">\n          <button class=\"chip is-active\">All channels<\u002Fbutton>\n          <button class=\"chip\">Email<\u002Fbutton>\n          <button class=\"chip\">LinkedIn<\u002Fbutton>\n          <button class=\"chip\">Twitter<\u002Fbutton>\n          <button class=\"chip\">Blog<\u002Fbutton>\n          <button class=\"chip\">Ads<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"row\" style=\"margin-top:var(--space-4)\">\n          <span class=\"chip chip--blue is-active\">B2B SaaS\n            <button class=\"chip-remove\" aria-label=\"Remove B2B SaaS\">\n              <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M2 2 L10 10 M10 2 L2 10\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fspan>\n          <span class=\"chip chip--blue is-active\">Series A\n            <button class=\"chip-remove\" aria-label=\"Remove Series A\">\n              <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M2 2 L10 10 M10 2 L2 10\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fspan>\n          <span class=\"chip chip--blue is-active\">United States\n            <button class=\"chip-remove\" aria-label=\"Remove United States\">\n              <svg viewBox=\"0 0 12 12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M2 2 L10 10 M10 2 L2 10\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- DROPDOWNS -->\n    <div class=\"sub-block\">\n      <h3 class=\"sub-title\">Dropdowns &amp; selects<\u002Fh3>\n      <p class=\"sub-desc\">All dropdowns use the same branded combobox panel — no native browser styling. The trigger matches the input field exactly, and the panel opens with optional search, hover/focus rings, and a check on the left for selected items.<\u002Fp>\n\n      <div class=\"demo-frame\" data-label=\"Closed states — click to open\">\n        <div class=\"form-grid\">\n          <div>\n            <label class=\"field-label\">Industry<\u002Flabel>\n            <div class=\"combobox\" data-combobox=\"\">\n              <button class=\"combobox-trigger\" type=\"button\">\n                <span>B2B SaaS<\u002Fspan>\n                <svg class=\"caret\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fbutton>\n              <div class=\"combobox-panel\" role=\"listbox\">\n an class=\"tooltip-trigger\" tabindex=\"0\">\n            <button class=\"btn btn--ghost btn--sm\" type=\"button\">Right ⏵<\u002Fbutton>\n            <span class=\"tooltip tooltip--right\">Positions to the right<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"tooltip-trigger\" tabindex=\"0\">\n            <span class=\"help-icon\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span class=\"tooltip\">Inline help icon<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- CHOICE CARDS -->\n    <div class=\"sub-block\">\n      <h3 class=\"sub-title\">Choice cards<\u002Fh3>\n      <p class=\"sub-desc\">For onboarding and survey moments — large, tappable, scannable. A stack of full-width cards beats a radio group every time. Each card is icon + title + subtitle + selection ring. Works as single-select (radio) or multi-select (checkbox).<\u002Fp>\n\n      <div class=\"demo-frame\" data-label=\"Single-select stack — onboarding\">\n        <div style=\"max-width: 520px; margin: 0 auto;\">\n          <h4 style=\"font-family: var(--font-display); font-size: 28px; font-weight: 400; letter-spacing: -0.015em; margin: 0 0 6px;\">Welcome to Moz<\u002Fh4>\n          <p style=\"font-size: 15px; color: var(--slate-600); margin: 0 0 24px;\">What sounds the most like you right now?<\u002Fp>\n          <div class=\"choice-stack\">\n            <button class=\"choice\" type=\"button\">\n              <span class=\"choice-icon\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <div class=\"choice-body\">\n                <span class=\"choice-title\">Our marketing is kind of a mess<\u002Fspan>\n                <span class=\"choice-subtitle\">Inconsistent, scattered, or embarrassing to review<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"choice-ring\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"choice is-selected\" type=\"button\">\n              <span class=\"choice-icon\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"22 12 18 12 15 21 9 3 6 12 2 12\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n              <div class=\"choice-body\">\n                <span class=\"choice-title\">We ship faster than we market<\u002Fspan>\n                <span class=\"choice-subtitle\">Product is great, but no one's hearing about it<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"choice-ring\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"choice\" type=\"button\">\n              <span class=\"choice-icon\">\n                <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8 und\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"3\" y1=\"9\" x2=\"21\" y2=\"9\"><\u002Fline><\u002Fsvg>\n              <\u002Fspan>\n              <div class=\"choice-body\">\n                <span class=\"choice-title\">Blog<\u002Fspan>\n                <span class=\"choice-subtitle\">Long-form posts on your domain<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"choice-ring\">\n                <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"demo-frame\" data-label=\"Compact (no icon)\" style=\"margin-top:var(--space-5)\">\n        <div style=\"max-width: 480px; margin: 0 auto;\">\n          <p style=\"font-size: 14px; font-weight: 600; color: var(--ink); margin: 0 0 12px;\">How many people are on your team?<\u002Fp>\n          <div class=\"choice-stack\">\n            <button class=\"choice choice--compact\" type=\"button\">\n              <span class=\"choice-title\">Just me<\u002Fspan>\n              <span class=\"choice-ring\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>\n            <\u002Fbutton>\n            <button class=\"choice choice--compact is-selected\" type=\"button\">\n              <span class=\"choice-title\">2 – 10<\u002Fspan>\n              <span class=\"choice-ring\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\ span class=\"status-tag\"><span class=\"dot dot--blue\"><\u002Fspan> Drafting<\u002Fspan>\n          <span class=\"status-tag\"><span class=\"dot dot--warn\"><\u002Fspan> Awaiting approval<\u002Fspan>\n          <span class=\"status-tag\"><span class=\"dot\"><\u002Fspan> Idle<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- CARDS -->\n    <div class=\"sub-block\">\n      <h3 class=\"sub-title\">Cards<\u002Fh3>\n      <p class=\"sub-desc\">Three flavours: feature, testimonial, pricing. All share the same 20-pixel radius and 1-pixel border.<\u002Fp>\n\n      <h4 class=\"mini-label\">Feature<\u002Fh4>\n      <div class=\"grid-3\">\n        <div class=\"card card--feature\">\n          <span class=\"card-icon\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M21 21l-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <h3>Studies your market<\u002Fh3>\n          <p>Moz reads your competitors, your reviews, and the conversations your customers are actually having.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card card--feature\">\n          <span class=\"card-icon\">\n            <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <h3>Understands the customer<\u002Fh3>\n          <p>Connect your support inbox and Moz learns the questions, objections, and language that move people.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"card card--feature\">\n          <span class=\"card- \"Twitter\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <a href=\"#\" aria-label=\"LinkedIn\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M19 3a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h14zM8 17v-7H6v7h2zM7 8.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4zM18 17v-4.2c0-1.7-.9-2.8-2.5-2.8-1.1 0-1.7.6-2 1.1V10h-2v7h2v-3.7c0-.9.4-1.5 1.2-1.5.8 0 1.3.5 1.3 1.5V17h2z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <a href=\"#\" aria-label=\"GitHub\">\n            <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 0a12 12 0 00-3.79 23.4c.6.1.82-.26.82-.58v-2.05c-3.34.72-4.04-1.6-4.04-1.6-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .11-.78.42-1.3.76-1.6-2.66-.3-5.46-1.33-5.46-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 016 0c2.3-1.55 3.3-1.23 3.3-1.23.66 1.65.25 2.87.12 3.17.77.84 1.24 1.91 1.24 3.22 0 4.61-2.8 5.62-5.47 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0012 0z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Product<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">How it works<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Integrations<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Pricing<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Changelog<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Company<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">About<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Customers<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Careers<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Press<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Resources<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">Blog<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Help center<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Brand kit<\u002Fa><\u002Fli>\n          <li><a href=\"#brand\">Design system<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"footer-col\">\n        <h4>Legal<\u002Fh4>\n        <ul>\n          <li><a href=\"#\">Privacy<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Terms<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Security<\u002Fa><\u002Fli>\n          <li><a href=\"#\">DPA<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"footer-bottom\">\n      <span>© 2026 Moz, Inc. All rights reserved.<\u002Fspan>\n      <span>Made with care in San Francisco.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // ─── Combobox: open/close panel ───────────────────────────\n  (function () {\n    const boxes = document.querySelectorAll('[data-combobox]');\n    boxes.forEach(box => {\n      const trigger = box.querySelector('.combobox-trigger');\n      if (!trigger) return;\n      trigger.addEventListener('click', e => {\n        e.stopPropagation();\n        if (box.dataset.stayOpen === 'true') return; // demo lock-open\n        const wasOpen = box.classList.contains('is-open');\n        document.querySelectorAll('[data-combobox]:not([data-stay-open]).is-open')\n          .forEach(b => b.classList.remove('is-open'));\n        if (!wasOpen) box.classList.add('is-open');\n      });\n      box.querySelectorAll('.combobox-option').forEach(opt => {\n        opt.addEventListener('click', () => {\n          if (box.dataset.stayOpen === 'true') return;\n          box.classList.remove('is-open');\n        });\n      });\n    });\n    document.addEventListener('click', e => {\n      if (!e.target.closest('[data-combobox]')) {\n        document.querySelectorAll('[data-combobox]:not([data-stay-open]).is-open')\n          .forEach(b => b.classList.remove('is-open'));\n      }\n    });\n    document.addEventListener('keydown', e => {\n      if (e.key === 'Escape') {\n        document.querySelectorAll('[data-combobox]:not([data-stay-open]).is-open')\n          .forEach(b => b.classList.remove('is-open'));\n      }\n      // ⌘K / Ctrl-K to focus the Search docs input\n      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {\n        const search = document.querySelector('input[type=\"search\"]');\n        if (search) {\n          e.preventDefault();\n          search.focus();\n          search.select();\n        }\n      }\n    });\n  })();\n\n  // ─── Phone number: digits / spaces / dashes / parens only ───\n  (function () {\n    document.querySelectorAll('input[type=\"tel\"]').forEach(inp => {\n      inp.addEventListener('input', () => {\n        const cleaned = inp.value.replace(/[^\\d\\s\\-\\(\\)\\+]/g, '');\n        if (cleaned !== inp.value) inp.value = cleaned;\n      });\n    });\n  })();\n\n  // ─── Currency input: digits, comma, dot only ────────────────\n  (function () {\n    document.querySelectorAll('input[inputmode=\"decimal\"]').forEach(inp => {\n      inp.addEventListener('input', () => {\n        const cleaned = inp.value.replace(/[^\\d\\.,]/g, '');\n        if (cleaned !== inp.value) inp.value = cleaned;\n      });\n    });\n  })();\n\n  // ─── OTP: digits only, auto-advance on input, backspace navigates back\n  (function () {\n    document.querySelectorAll('.otp').forEach(group => {\n      const cells = group.querySelectorAll('.otp-cell');\n      cells.forEach((cell, i) => {\n        cell.addEventListener('input', e => {\n          cell.value = cell.value.replace(/\\D/g, '').slice(0, 1);\n          cell.classList.toggle('is-focused', false);\n          if (cell.value && cells[i + 1]) {\n            cells[i + 1].focus();\n            cells[i + 1].select();\n          }\n        });\n        cell.addEventListener('keydown', e => {\n          if (e.key === 'Backspace' && !cell.value && cells[i - 1]) {\n            cells[i - 1].focus();\n            cells[i - 1].select();\n          }\n          if (e.key === 'ArrowLeft' && cells[i - 1])  cells[i - 1].focus();\n          if (e.key === 'ArrowRight' && cells[i + 1]) cells[i + 1].focus();\n        });\n        cell.addEventListener('paste', e => {\n          e.preventDefault();\n          const digits = (e.clipboardData.getData('text') || '').replace(/\\D/g, '').split('');\n          cells.forEach((c, idx) => {\n            if (digits[idx]) c.value = digits[idx];\n          });\n          const next = Math.min(digits.length, cells.length - 1);\n          cells[next].focus();\n        });\n        cell.addEventListener('focus', () => {\n          cells.forEach(c => c.classList.remove('is-focused'));\n        });\n      });\n    });\n  })();\n\n  // ─── Choice cards: toggle selection ─────────────────────────\n  (function () {\n    document.querySelectorAll('.choice-stack').forEach(stack => {\n      const choices = stack.querySelectorAll('.choice');\n      const isMulti = stack.querySelector('.choice--multi');\n      choices.forEach(c => {\n        c.addEventListener('click', e => {\n          if (e.target.closest('.btn')) return;\n          if (isMulti) {\n            c.classList.toggle('is-selected');\n          } else {\n            choices.forEach(o => o.classList.remove('is-selected'));\n            c.classList.add('is-selected');\n          }\n        });\n      });\n    });\n  })();\n\n  // ─── Email validation (Billing email in anatomy) ────────────\n  (function () {\n    document.querySelectorAll('input[type=\"email\"]').forEach(inp => {\n      inp.addEventListener('blur', () => {\n        const v = inp.value.trim();\n        const ok = !v || /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v);\n        inp.classList.toggle('is-error', !ok);\n      });\n    });\n  })();\n\n  // ─── Character counter live update ──────────────────────────\n  (function () {\n    document.querySelectorAll('[data-counter]').forEach(label => {\n      const input = document.getElementById(label.dataset.counter);\n      if (!input) return;\n      const max = parseInt(label.dataset.max || '80', 10);\n      const out = label.querySelector('.counter-out');\n      const update = () => { if (out) out.textContent = input.value.length + ' / ' + max; };\n      input.addEventListener('input', update);\n      update();\n    });\n  })();\n\n  // ─── Search docs: autocomplete dropdown ─────────────────────\n  (function () {\n    const search = document.querySelector('input[type=\"search\"]');\n    if (!search) return;\n    const dropdown = document.createElement('div');\n    dropdown.className = 'autocomplete-panel';\n    const ITEMS = [\n      { title: 'Connecting LinkedIn', cat: 'Setup' },\n      { title: 'Connecting your blog', cat: 'Setup' },\n      { title: 'Connecting Gmail / Outlook', cat: 'Setup' },\n      { title: 'Brand voice training', cat: 'Brand' },\n      { title: 'Tone of voice examples', cat: 'Brand' },\n      { title: 'Setting tone & guardrails', cat: 'Brand' },\n      { title: 'Campaign reporting', cat: 'Analytics' },\n      { title: 'Channel A/B testing', cat: 'Analytics' },\n      { title: 'Reading the funnel report', cat: 'Analytics' },\n      { title: 'Rotating your API key', cat: 'Security' },\n      { title: 'Setting up SSO', cat: 'Security' },\n      { title: 'Two-factor authentication', cat: 'Security' },\n    ];\n    const wrap = search.closest('.input--with-icon');\n    if (!wrap) return;\n    wrap.style.position = 'relative';\n    wrap.appendChild(dropdown);\n\n    function render(q) {\n      const ql = q.toLowerCase().trim();\n      const matches = ql ? ITEMS.filter(i => i.title.toLowerCase().includes(ql)) : ITEMS.slice(0, 6);\n      if (matches.length === 0) {\n        dropdown.innerHTML = '<div class=\"autocomplete-empty\">No results for &ldquo;' + q + '&rdquo;<\u002Fdiv>';\n      } else {\n        dropdown.innerHTML = matches.map((m, i) => `\n          <button type=\"button\" class=\"autocomplete-row${i === 0 ? ' is-focused' : ''}\">\n            <span class=\"autocomplete-title\">${m.title}<\u002Fspan>\n            <span class=\"autocomplete-cat\">${m.cat}<\u002Fspan>\n          <\u002Fbutton>\n        `).join('');\n      }\n    }\n    search.addEventListener('focus', () => {\n      render(search.value);\n      dropdown.classList.add('is-open');\n    });\n    search.addEventListener('input', () => {\n      render(search.value);\n      dropdown.classList.add('is-open');\n    });\n    search.addEventListener('blur', () => {\n      setTimeout(() => dropdown.classList.remove('is-open'), 120);\n    });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
